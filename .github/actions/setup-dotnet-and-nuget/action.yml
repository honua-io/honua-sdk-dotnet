name: Setup .NET + NuGet (Honua)
description: >-
  Shared bootstrap for Honua SDK CI jobs. Restores the NuGet cache, installs
  the project-pinned .NET SDK, and authenticates the github-honua package
  source. Centralising this step removes drift between the per-package matrix
  legs and keeps the action versions consistent across the workflow.

inputs:
  dotnet-version:
    description: .NET SDK version to install (matches workflow env DOTNET_VERSION).
    required: true
  github-actor:
    description: GitHub actor used to authenticate the github-honua NuGet source.
    required: true
  github-token:
    description: Token used to authenticate the github-honua NuGet source.
    required: true

runs:
  using: composite
  steps:
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Pin and verify SDK workload tuple
      shell: bash
      run: python3 scripts/ci/prepare-dotnet-toolchain.py

    - name: Configure GitHub Packages
      shell: bash
      run: dotnet nuget update source github-honua --username "${{ inputs.github-actor }}" --password "${{ inputs.github-token }}" --store-password-in-clear-text
