name: .NET SDK Staging Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  workflow_call:
    inputs:
      artifact-retention:
        description: Artifact retention window in days.
        required: false
        default: 30
        type: number

env:
  DOTNET_VERSION: "10.0.400"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # Ephemeral-mode pins. Kept in step with conformance.yml, which certifies the
  # same image; see conformance/PINS.md.
  EPHEMERAL_HONUA_SERVER_IMAGE: "ghcr.io/honua-io/honua-server@sha256:d7a45c871bf318b4882ec8e1c32004803e6d0210246be30120751f05dee1a14d"
  EPHEMERAL_HONUA_SERVER_SEED_REF: "e3ab87cebb7bf2d32c4e8cdb145f8d626b864d8e"
  # Identifiers seeded by honua-server tests/seed/base-schema.sql.
  EPHEMERAL_SERVICE_NAME: "test_service"
  EPHEMERAL_LAYER_ID: "0"
  EPHEMERAL_OGC_COLLECTION_ID: "0"

permissions:
  contents: read
  packages: read

jobs:
  staging-preflight:
    name: Staging Configuration Preflight
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      configured: ${{ steps.validate-config.outputs.configured }}
      mode: ${{ steps.validate-config.outputs.mode }}
    env:
      HONUA_STAGING_BASE_URL: ${{ vars.HONUA_STAGING_BASE_URL }}
      HONUA_STAGING_API_KEY: ${{ secrets.HONUA_STAGING_API_KEY }}
      HONUA_STAGING_BEARER_TOKEN: ${{ secrets.HONUA_STAGING_BEARER_TOKEN }}
      HONUA_STAGING_SERVICE_NAME: ${{ vars.HONUA_STAGING_SERVICE_NAME }}
      HONUA_STAGING_LAYER_ID: ${{ vars.HONUA_STAGING_LAYER_ID }}
      HONUA_STAGING_WFS_TYPENAME: ${{ vars.HONUA_STAGING_WFS_TYPENAME }}
      HONUA_STAGING_OGC_COLLECTION_ID: ${{ vars.HONUA_STAGING_OGC_COLLECTION_ID }}
      WORKFLOW_EVENT: ${{ github.event_name }}
    steps:
      - name: Validate staging configuration
        id: validate-config
        shell: bash
        run: |
          missing=()

          require_value() {
            local value="$1"
            local key="$2"
            if [[ -z "${value}" ]]; then
              missing+=("${key}")
            fi
          }

          require_value "${HONUA_STAGING_BASE_URL}" "HONUA_STAGING_BASE_URL"
          require_value "${HONUA_STAGING_SERVICE_NAME}" "HONUA_STAGING_SERVICE_NAME"
          require_value "${HONUA_STAGING_LAYER_ID}" "HONUA_STAGING_LAYER_ID"
          require_value "${HONUA_STAGING_WFS_TYPENAME}" "HONUA_STAGING_WFS_TYPENAME"
          require_value "${HONUA_STAGING_OGC_COLLECTION_ID}" "HONUA_STAGING_OGC_COLLECTION_ID"

          if [[ -z "${HONUA_STAGING_API_KEY}" && -z "${HONUA_STAGING_BEARER_TOKEN}" ]]; then
            missing+=("HONUA_STAGING_API_KEY or HONUA_STAGING_BEARER_TOKEN")
          fi

          if (( ${#missing[@]} == 0 )); then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "mode=external" >> "${GITHUB_OUTPUT}"
            {
              echo "## Staging Integration Preflight"
              echo
              echo "Configuration is present; the read-only staging suite will run."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # No deployed staging environment. Rather than blocking the release -
          # which is what happened to dotnet-sdk-v1.6.1 and v1.6.2, silently -
          # run the same read-only suite against a hermetic server booted from
          # the pinned image and honua-server's own seed.
          echo "configured=true" >> "${GITHUB_OUTPUT}"
          echo "mode=ephemeral" >> "${GITHUB_OUTPUT}"
          {
            echo "## Staging Integration Preflight"
            echo
            echo "Mode: \`ephemeral\` - no deployed staging environment is configured."
            echo "Unset: \`${missing[*]}\`."
            echo
            echo "The suite will run against a digest-pinned honua-server booted in CI and seeded"
            echo "from \`tests/seed/base-schema.sql\`. This checks the published SDK against the"
            echo "published server image; it does **not** exercise a real deployment."
            echo
            echo "To test a real deployment instead, set the values in the \`staging\` environment"
            echo "and this job switches to \`external\` automatically. See \`docs/staging-integration.md\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  staging-integration:
    name: Staging Read-Only Integration
    needs: staging-preflight
    if: ${{ needs.staging-preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    services:
      # Only used when mode == 'ephemeral'. Mirrors conformance.yml so both
      # lanes certify against the same database shape.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STAGING_MODE: ${{ needs.staging-preflight.outputs.mode }}
      HONUA_STAGING_BASE_URL: ${{ vars.HONUA_STAGING_BASE_URL }}
      HONUA_STAGING_API_KEY: ${{ secrets.HONUA_STAGING_API_KEY }}
      HONUA_STAGING_BEARER_TOKEN: ${{ secrets.HONUA_STAGING_BEARER_TOKEN }}
      HONUA_STAGING_SERVICE_NAME: ${{ vars.HONUA_STAGING_SERVICE_NAME }}
      HONUA_STAGING_LAYER_ID: ${{ vars.HONUA_STAGING_LAYER_ID }}
      HONUA_STAGING_WFS_TYPENAME: ${{ vars.HONUA_STAGING_WFS_TYPENAME }}
      HONUA_STAGING_OGC_COLLECTION_ID: ${{ vars.HONUA_STAGING_OGC_COLLECTION_ID }}
      HONUA_STAGING_SERVER_COMMIT: ${{ vars.HONUA_STAGING_SERVER_COMMIT }}
      HONUA_STAGING_SERVER_IMAGE: ${{ vars.HONUA_STAGING_SERVER_IMAGE }}
      HONUA_STAGING_SEED_PROFILE: ${{ vars.HONUA_STAGING_SEED_PROFILE }}
      HONUA_STAGING_ENABLE_FEATURESERVER_EDITS: ${{ vars.HONUA_STAGING_ENABLE_FEATURESERVER_EDITS }}
      HONUA_STAGING_FEATURESERVER_EDIT_ADD_ATTRIBUTES_JSON: ${{ vars.HONUA_STAGING_FEATURESERVER_EDIT_ADD_ATTRIBUTES_JSON }}
      HONUA_STAGING_FEATURESERVER_EDIT_UPDATE_ATTRIBUTES_JSON: ${{ vars.HONUA_STAGING_FEATURESERVER_EDIT_UPDATE_ATTRIBUTES_JSON }}
      HONUA_STAGING_FEATURESERVER_EDIT_GEOMETRY_JSON: ${{ vars.HONUA_STAGING_FEATURESERVER_EDIT_GEOMETRY_JSON }}
      HONUA_STAGING_EVIDENCE_PATH: ${{ github.workspace }}/artifacts/evidence/ci-report.json
      HONUA_STAGING_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TEST_RESULTS_DIR: ${{ github.workspace }}/artifacts/test-results
      TEST_RESULTS_FILE: staging-integration.trx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ github.repository }}-${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify pinned .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(dotnet --version)"
          if [[ "${actual_version}" != "${DOTNET_VERSION}" ]]; then
            echo "::error::setup-dotnet resolved ${actual_version}; expected ${DOTNET_VERSION}."
            exit 1
          fi

      # Ephemeral mode: seed a database from honua-server's own base schema and
      # boot the pinned image against it, then point the suite at localhost.
      # A configured `staging` environment skips all of this.
      - name: Seed and boot an ephemeral Honua server
        if: ${{ needs.staging-preflight.outputs.mode == 'ephemeral' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGPASSWORD: honua
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .staging
          gh api \
            "repos/honua-io/honua-server/contents/tests/seed/base-schema.sql?ref=${EPHEMERAL_HONUA_SERVER_SEED_REF}" \
            -H "Accept: application/vnd.github.raw" > .staging/base-schema.sql
          test -s .staging/base-schema.sql

          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -f .staging/base-schema.sql

          key="$(head -c 32 /dev/urandom | base64)"
          salt="$(head -c 16 /dev/urandom | base64)"
          docker run -d --name honua-staging --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=honua" \
            -e Security__ConnectionEncryption__MasterKey="${key}" \
            -e Security__ConnectionEncryption__Salt="${salt}" \
            -e HONUA_ADMIN_PASSWORD="ci-admin-password" \
            -e Kestrel__Endpoints__Http__Url="http://+:8080" \
            -e Kestrel__Endpoints__Http__Protocols="Http1" \
            -e Kestrel__Endpoints__Grpc__Url="http://+:8081" \
            -e Kestrel__Endpoints__Grpc__Protocols="Http2" \
            "${EPHEMERAL_HONUA_SERVER_IMAGE}"

          code=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz/ready || true)"
            [ "$code" = "200" ] && { echo "ready after $((i*3))s"; break; }
            sleep 3
          done
          if [ "${code}" != "200" ]; then
            echo "::error::ephemeral honua-server did not become ready"
            docker logs honua-staging || true
            exit 1
          fi

          # Read the WFS type name off the running server rather than pinning a
          # literal, so a seed change cannot leave the gate asserting a name that
          # no longer exists.
          #
          # WFS is served at the ROOT `/wfs`, not under
          # `/ogc/services/{serviceId}/`. WMS, WMTS and WCS are service-scoped;
          # WFS is not, and asking for the scoped path returns 404 -- which
          # `curl -sf` reports as exit 22 with no body, so the failure reads as
          # "the server is broken" rather than "that route does not exist".
          # See honua-server docs/reference/protocols/wms-wfs-wcs-wmts.md.
          caps="$(curl -sf "http://localhost:8080/wfs?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities")"
          typename="$(printf '%s' "$caps" | grep -oPm1 '(?<=<wfs:Name>)[^<]+' || true)"
          if [ -z "$typename" ]; then
            typename="$(printf '%s' "$caps" | grep -oPm1 '(?<=<Name>)[^<]+' || true)"
          fi
          if [ -z "$typename" ]; then
            status="$(curl -s -o /dev/null -w '%{http_code}'               "http://localhost:8080/wfs?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities" || true)"
            echo "::error::could not read a WFS type name from GetCapabilities (HTTP ${status})"
            printf '%s' "$caps" | head -c 2000
            exit 1
          fi
          echo "resolved WFS type name: ${typename}"

          {
            echo "HONUA_STAGING_BASE_URL=http://localhost:8080"
            echo "HONUA_STAGING_API_KEY=ci-admin-password"
            echo "HONUA_STAGING_SERVICE_NAME=${EPHEMERAL_SERVICE_NAME}"
            echo "HONUA_STAGING_LAYER_ID=${EPHEMERAL_LAYER_ID}"
            echo "HONUA_STAGING_OGC_COLLECTION_ID=${EPHEMERAL_OGC_COLLECTION_ID}"
            echo "HONUA_STAGING_WFS_TYPENAME=${typename}"
            echo "HONUA_STAGING_SERVER_IMAGE=${EPHEMERAL_HONUA_SERVER_IMAGE}"
            echo "HONUA_STAGING_SEED_PROFILE=base-schema@${EPHEMERAL_HONUA_SERVER_SEED_REF}"
          } >> "${GITHUB_ENV}"

      - name: Configure GitHub Packages
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Run staging integration suite
        id: run-tests
        shell: bash
        run: |
          mkdir -p "${TEST_RESULTS_DIR}" "$(dirname "${HONUA_STAGING_EVIDENCE_PATH}")"
          dotnet test tests/Honua.Sdk.IntegrationTests/Honua.Sdk.IntegrationTests.csproj \
            --configuration Release \
            /p:TreatWarningsAsErrors=true \
            /p:EnforceCodeStyleInBuild=true \
            --logger "trx;LogFileName=${TEST_RESULTS_FILE}" \
            --results-directory "${TEST_RESULTS_DIR}"

      - name: Stop the ephemeral server
        if: ${{ always() && needs.staging-preflight.outputs.mode == 'ephemeral' }}
        shell: bash
        run: |
          docker logs honua-staging > "${TEST_RESULTS_DIR:-.}/honua-staging.log" 2>&1 || true
          docker rm -f honua-staging || true

      - name: Write staging summary
        if: always()
        env:
          PRECHECK_OUTCOME: configured
          TEST_OUTCOME: ${{ steps.run-tests.outcome }}
        shell: bash
        run: |
          if [[ -f "${HONUA_STAGING_EVIDENCE_PATH}" ]]; then
            python3 - <<'PY'
          import json
          import os

          evidence_path = os.environ["HONUA_STAGING_EVIDENCE_PATH"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          precheck_outcome = os.environ.get("PRECHECK_OUTCOME", "unknown")
          test_outcome = os.environ.get("TEST_OUTCOME", "not-run")

          with open(evidence_path, encoding="utf-8") as evidence_file:
              report = json.load(evidence_file)

          summary = report.get("Summary", {})
          checks = report.get("Checks", [])
          sdk_packages = report.get("SdkPackages", [])
          protocol_surfaces = report.get("ProtocolSurfaces", [])
          feature_server_edit_check_ran = report.get("FeatureServerEditCheckRan", False)

          with open(summary_path, "a", encoding="utf-8") as summary_file:
              summary_file.write("## Staging Integration\n\n")
              summary_file.write(f"- Precheck: `{precheck_outcome}`\n")
              summary_file.write(f"- Test step: `{test_outcome}`\n")
              summary_file.write(f"- Base URL: `{report.get('BaseUrl', 'unknown')}`\n")
              summary_file.write(f"- Service: `{report.get('ServiceName', 'unknown')}`\n")
              summary_file.write(f"- Layer ID: `{report.get('LayerId', 'unknown')}`\n")
              summary_file.write(f"- WFS type: `{report.get('WfsTypeName', 'unknown')}`\n")
              summary_file.write(f"- OGC collection: `{report.get('OgcCollectionId', 'unknown')}`\n")
              summary_file.write(f"- Server commit: `{report.get('ServerCommit') or 'unknown'}`\n")
              summary_file.write(f"- Server image: `{report.get('ServerImage') or 'unknown'}`\n")
              summary_file.write(f"- Seed profile: `{report.get('SeedProfile') or 'unknown'}`\n")
              summary_file.write(f"- FeatureServer edit check: `{'ran' if feature_server_edit_check_ran else 'not run'}`\n")
              summary_file.write(f"- Protocol surfaces: `{', '.join(protocol_surfaces) or 'unknown'}`\n")
              summary_file.write(
                  "- SDK packages: `" +
                  ", ".join(
                      f"{package.get('Package', 'unknown')} {package.get('Version', 'unknown')}"
                      for package in sdk_packages
                  ) +
                  "`\n"
              )
              summary_file.write(
                  f"- Summary: {summary.get('Passed', 0)} passed, "
                  f"{summary.get('Failed', 0)} failed, "
                  f"{summary.get('NotRun', 0)} not run\n\n"
              )
              summary_file.write("| Check | Status | Details |\n")
              summary_file.write("| --- | --- | --- |\n")

              for check in checks:
                  details = str(check.get("Details", "")).replace("\n", " ").strip()
                  if len(details) > 160:
                      details = details[:157] + "..."
                  summary_file.write(
                      f"| `{check.get('Name', 'unknown')}` | "
                      f"{check.get('Status', 'unknown')} | "
                      f"{details} |\n"
                  )
          PY
          else
            {
              echo "## Staging Integration"
              echo
              echo "- Precheck: \`${PRECHECK_OUTCOME}\`"
              echo "- Test step: \`${TEST_OUTCOME:-not-run}\`"
              echo "- Evidence file: not produced."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload staging test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-staging-integration-${{ github.run_id }}-test-results
          path: ${{ github.workspace }}/artifacts/test-results/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'workflow_call' && inputs['artifact-retention'] || 30 }}

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-staging-integration-${{ github.run_id }}-evidence
          path: ${{ github.workspace }}/artifacts/evidence/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'workflow_call' && inputs['artifact-retention'] || 30 }}
