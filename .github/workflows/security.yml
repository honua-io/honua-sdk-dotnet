name: Security

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced. Only a first
  # attempt cancels: a re-run (run_attempt > 1) of an older head keeps that head's PR
  # group and would otherwise cancel the newest head's run, so it queues instead.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  # Pin shared security workflows to an immutable commit so this repo is not
  # exposed to parser or behavior drift on honua-io/.github@main.
  trivy:
    uses: honua-io/.github/.github/workflows/reusable-trivy.yml@aebfacd3f3c6b551fa9bf703501c0a12a050faf3
    with:
      scan-type: fs

  scorecard:
    uses: honua-io/.github/.github/workflows/reusable-scorecard.yml@e26b67e904f2c23796fe677d267d73188a764545
