name: Certification pin follow

on:
  schedule:
    # After the 15:30 protocol certification schedule, so a drifted pin gets a
    # pull request the same day.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-pin-follow
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # contents: write pushes the pin branch. pull-requests: write opens or
      # updates that one pull request. actions: write dispatches
      # sdk-certification.yml. A GITHUB_TOKEN push or pull request does not
      # start pull_request workflows; workflow_dispatch is the documented
      # exception, same as the publish job in release-please.yml. Job-level
      # write is the least privilege that still lets this job publish the pin.
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: trunk
          fetch-depth: 0

      - name: Open or update one pin pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/certification-pin-follow"

          # workflow_dispatch is the exception that still runs when the caller
          # is GITHUB_TOKEN. Pin the run to the commit the pull request will
          # review, on the pr tier the pull_request lane would have used.
          # Skip when that commit already has a certification run so a later
          # schedule does not start a second one. A missing run is retried:
          # once the pin commit is on the branch, the next schedule sees a
          # clean tree and would otherwise never dispatch.
          dispatch_certification() {
            local sha="$1"
            local count
            count="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow sdk-certification.yml --commit "${sha}" --json databaseId --jq 'length')"
            if [[ "${count}" != "0" ]]; then
              echo "sdk-certification.yml already has ${count} run(s) on ${sha}."
              return 0
            fi
            gh workflow run sdk-certification.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${sha}" \
              -f tier=pr
            echo "Dispatched sdk-certification.yml tier=pr on ${sha}."
          }

          git config user.name "Mike McDougall"
          git config user.email "mike@honua.io"
          git fetch origin trunk
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "${branch}"
            git checkout -B "${branch}" "origin/${branch}"
            git merge origin/trunk -m "merge trunk into certification pin follow"
          else
            git checkout -B "${branch}" origin/trunk
          fi
          python3 scripts/prepare-installed-package-certification.py \
            --pins certification/candidate-pins.json \
            --follow-manifest
          if git diff --quiet -- certification/candidate-pins.json; then
            echo "Pin file already matches the published honua-release manifest."
            # HEAD may be a local merge of trunk that this run does not push.
            # Retry dispatch only for the commit already on the remote branch.
            if git rev-parse --verify --quiet "origin/${branch}" >/dev/null \
              && ! git diff --quiet origin/trunk "origin/${branch}" -- certification/candidate-pins.json; then
              dispatch_certification "$(git rev-parse "origin/${branch}")"
            fi
            exit 0
          fi
          # Same verifier the certification workflow runs. A failure here does not open a PR.
          python3 scripts/prepare-installed-package-certification.py \
            --pins certification/candidate-pins.json \
            --check
          git add certification/candidate-pins.json
          git commit -m "chore(certification): follow the published Honua.Sdk pin"
          git push origin "HEAD:${branch}"
          version="$(python3 -c 'import json; print(json.load(open("certification/candidate-pins.json"))["sdkPackageVersion"])')"
          body="$(cat <<EOF
          Follows \`clientArtifacts.honua-sdk-dotnet\` on honua-release \`trunk\`.

          The pin file now names Honua.Sdk ${version}. \`--follow-manifest\` copied the published manifest coordinate and took the SHA-512 from the nuget.org bytes. \`--check\` then verified those bytes against nuget.org and the manifest again. Server pins are unchanged.

          This pull request does not merge itself.

          Certification is dispatched on this commit with tier pr. A repository-token push does not start pull_request workflows.
          EOF
          )"
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --base trunk --state open --json number --jq '.[0].number')"
          if [[ -z "${existing}" || "${existing}" == "null" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base trunk \
              --head "${branch}" \
              --title "chore(certification): follow the published Honua.Sdk pin" \
              --body "${body}"
          else
            gh pr edit "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "Updated pull request #${existing}"
          fi
          dispatch_certification "$(git rev-parse HEAD)"
