name: Docs

on:
  workflow_dispatch:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build DocFX site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OKF bundle gate. docs/okf-bundle.v1.json declares which markdown is
      # product documentation; every page inside that boundary must carry valid
      # Open Knowledge Format v0.2 frontmatter. Runs before the site build so a
      # page that lands untyped fails here rather than shipping.
      # See agent-delivery-spec WS9.
      - name: Validate OKF documentation bundle
        run: python3 scripts/check-okf-bundle.py

      # SUMMARY.md is GitBook's table of contents, derived from the same
      # boundary the gate above checks. A page added to the bundle and not the
      # TOC - or the reverse - fails here rather than shipping a contents page
      # that disagrees with the bundle.
      - name: Verify the GitBook table of contents is derived
        run: python3 scripts/generate-summary.py --check

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ github.repository }}-${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pin and verify SDK workload tuple
        shell: bash
        run: python3 scripts/ci/prepare-dotnet-toolchain.py

      - name: Configure GitHub Packages
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Require committed NuGet lock files
        shell: bash
        run: |
          mapfile -t locks < <(git ls-files '**/packages.lock.json')
          if [[ ${#locks[@]} -eq 0 ]]; then
            echo "::error::No packages.lock.json is committed, so 'dotnet restore --locked-mode' does not pin the graph."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Honua.Sdk.sln --locked-mode

      - name: Build solution
        run: dotnet build Honua.Sdk.sln --configuration Release /p:TreatWarningsAsErrors=true

      - name: Install DocFX
        run: dotnet tool update --global docfx

      - name: Build DocFX site
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          docfx docs/docfx.json
          # Pages serves index.json at the site root when index.html is absent.
          # README.html is the documentation homepage DocFX already builds.
          if [[ ! -f docs/_site/README.html ]]; then
            echo "::error::DocFX did not write docs/_site/README.html."
            exit 1
          fi
          cp docs/_site/README.html docs/_site/index.html

      - name: Require GitHub Pages publication on trunk
        if: github.ref == 'refs/heads/trunk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOY_GITHUB_PAGES: ${{ vars.DEPLOY_GITHUB_PAGES }}
        run: |
          if [[ "${DEPLOY_GITHUB_PAGES}" != "true" ]]; then
            echo "::error::DEPLOY_GITHUB_PAGES is not true. This trunk run built the DocFX site and did not publish it."
            exit 1
          fi
          echo "DEPLOY_GITHUB_PAGES is true. The following steps publish the DocFX site."

      - name: Configure GitHub Pages
        if: vars.DEPLOY_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/trunk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload DocFX site artifact
        if: vars.DEPLOY_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/trunk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy-docs:
    name: Deploy DocFX site
    needs: build-docs
    if: vars.DEPLOY_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/trunk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
