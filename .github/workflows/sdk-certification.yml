name: .NET SDK Protocol Certification
run-name: ${{ inputs.nightly_dispatch_id && format('.NET SDK Protocol Certification [{0}]', inputs.nightly_dispatch_id) || '.NET SDK Protocol Certification' }}

on:
  pull_request:
    branches: [trunk]
    paths:
      - "src/**"
      - "tests/Honua.Sdk.ProtocolIntegration.Tests/**"
      - "tests/Honua.Sdk.Conformance.Tests/**"
      - "scripts/generate-sdk-certification.py"
      - "scripts/certification_entitlement.py"
      - "scripts/observe-certification-entitlement.py"
      - "scripts/prepare-installed-package-certification.py"
      - "certification/candidate-pins.json"
      - "certification/requirements-pins.json"
      - "scripts/fetch-certification-requirements.py"
      - "scripts/check-certification-receipt-contract.py"
      - "scripts/tests/**"
      - "contracts/sdk-certification.v1.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/sdk-certification.yml"
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        options: [release, nightly, pr]
        default: release
        required: true
      server_image:
        description: "Immutable candidate image (required for release)"
        required: false
      server_source_sha:
        description: "Full source commit that produced the image (required for release)"
        required: false
      server_seed_ref:
        description: "Exact seed revision; must equal source SHA for release"
        required: false
      release_cut:
        description: "Independently frozen ISO-8601 release cut (required for release)"
        required: false
      requirements_ref:
        description: "Immutable honua-release protected-trunk ancestor SHA; pair with requirements_revision"
        required: false
      requirements_revision:
        description: "Exact governed revision at requirements_ref; release must supply both"
        required: false
      fixture_revision:
        description: "Deterministic fixture/profile revision (required for release)"
        required: false
      nightly_dispatch_id:
        description: Nightly orchestrator correlation ID (nightly-certification-<run>-<attempt>), recorded in each executed evidence receipt
        required: false
        type: string

env:
  DOTNET_VERSION: "10.0.401"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # The server candidate and the published Honua.Sdk package are pinned in
  # certification/candidate-pins.json; the "Load candidate pins" step exports them as
  # PINNED_SERVER_*, PINNED_SDK_* and PINNED_CANDIDATE_CUT. Digest only; never :nightly
  # or :nightly-aot. PINNED_CANDIDATE_CUT is the honua-release manifest
  # protocolCertification.candidateCutAt for the pinned server snapshot.
  # The historical rc-cert image e3ab87ce / sha256:d7a45c87 predates Licensing__Mode
  # and returns 402 for FeatureServer edits; that receipt stays the unentitled result.
  HONUA_PROTOCOL_SERVICE_NAME: "test_service"
  HONUA_PROTOCOL_LAYER_ID: "0"
  HONUA_PROTOCOL_OGC_COLLECTION_ID: "0"

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  certify:
    runs-on: ubuntu-latest
    # Release dispatches run inside a protected environment (required reviewers) that alone
    # holds HONUA_CERTIFICATION_LICENSE_CONTENT; pr/nightly attach to no environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'release' && 'release-certification' || '' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve certification tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TIER: ${{ inputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          # inputs.tier is empty on schedule, and a later pin failure skips the
          # identity step. Resolve the tier here so evidence still receives it.
          case "${EVENT_NAME}" in
            schedule) tier=nightly ;;
            pull_request) tier=pr ;;
            workflow_dispatch)
              tier="${INPUT_TIER}"
              [[ -n "${tier}" ]] || { echo '::error::workflow_dispatch tier input is empty.'; exit 1; }
              ;;
            *) tier=pr ;;
          esac
          echo "tier=${tier}" >> "${GITHUB_OUTPUT}"

      - name: Retain immutable governed requirements and strict consumer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_TIER: ${{ steps.tier.outputs.tier }}
          REQUIREMENTS_REF: ${{ inputs.requirements_ref }}
          REQUIREMENTS_REVISION: ${{ inputs.requirements_revision }}
        run: |
          set -euo pipefail
          if [[ "${CERT_TIER}" == release && ( -z "${REQUIREMENTS_REF}" || -z "${REQUIREMENTS_REVISION}" ) ]]; then
            echo '::error::Release requires exact requirements_ref and requirements_revision.'
            exit 1
          fi
          args=()
          if [[ -n "${REQUIREMENTS_REF}" || -n "${REQUIREMENTS_REVISION}" ]]; then
            args+=(--source-sha "${REQUIREMENTS_REF}" --requirements-revision "${REQUIREMENTS_REVISION}")
          fi
          python3 scripts/fetch-certification-requirements.py --destination artifacts/governance "${args[@]}"
          python3 scripts/check-certification-receipt-contract.py --governance-dir artifacts/governance

      - name: Load candidate pins
        run: python3 scripts/prepare-installed-package-certification.py --pins certification/candidate-pins.json --emit-env >> "${GITHUB_ENV}"

      - name: Verify candidate pins against nuget.org and honua-release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Pull requests check only a pin advance; external drift reds the scheduled run, not unrelated PRs.
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            if git diff --quiet FETCH_HEAD HEAD -- certification/candidate-pins.json; then
              echo "certification/candidate-pins.json is unchanged from ${BASE_REF}."
              exit 0
            fi
          fi
          python3 scripts/prepare-installed-package-certification.py --pins certification/candidate-pins.json --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve tier and immutable identity
        id: identity
        env:
          CERT_TIER: ${{ steps.tier.outputs.tier }}
          INPUT_IMAGE: ${{ inputs.server_image }}
          INPUT_SOURCE_SHA: ${{ inputs.server_source_sha }}
          INPUT_SEED_REF: ${{ inputs.server_seed_ref }}
          INPUT_RELEASE_CUT: ${{ inputs.release_cut }}
          INPUT_FIXTURE_REVISION: ${{ inputs.fixture_revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tier="${CERT_TIER}"
          [[ -n "${tier}" ]] || { echo '::error::Certification tier is empty.'; exit 1; }
          if [[ "${tier}" == release ]]; then
            [[ -n "${INPUT_IMAGE}" ]] || { echo '::error::Release server_image input is required.'; exit 1; }
            [[ -n "${INPUT_SOURCE_SHA}" ]] || { echo '::error::Release server_source_sha input is required.'; exit 1; }
          fi
          image="${INPUT_IMAGE:-${PINNED_SERVER_IMAGE}}"
          source_sha="${INPUT_SOURCE_SHA:-${PINNED_SERVER_SOURCE_SHA}}"
          seed_ref="${INPUT_SEED_REF:-${source_sha}}"
          expected_fixture_revision="${INPUT_FIXTURE_REVISION:-${PINNED_SERVER_FIXTURE_REVISION}}"
          release_cut="${INPUT_RELEASE_CUT:-${PINNED_CANDIDATE_CUT}}"
          if [[ ! "${image}" =~ ^ghcr\.io/honua-io/honua-server@sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Refusing a floating or tagged server image. Certification requires ghcr.io/honua-io/honua-server@sha256:<digest>.'
            exit 1
          fi
          if [[ "${tier}" == release ]]; then
            [[ "${image}" == "${PINNED_SERVER_IMAGE}" ]] || { echo '::error::Release image is not the manifest candidate digest.'; exit 1; }
            [[ "${source_sha}" == "${PINNED_SERVER_SOURCE_SHA}" ]] || { echo '::error::Release source SHA is not the manifest server pin.'; exit 1; }
            [[ "${expected_fixture_revision}" == "${PINNED_SERVER_FIXTURE_REVISION}" ]] || { echo '::error::Release fixture revision is not the candidate pin.'; exit 1; }
          fi
          image_metadata="$(docker buildx imagetools inspect "${image}" --format '{{json .}}')"
          resolved_digest="$(jq -er '.manifest.digest' <<< "${image_metadata}")"
          requested_digest="${image##*@}"
          [[ "${requested_digest}" == "${resolved_digest}" ]] || { echo '::error::Requested image digest did not resolve exactly.'; exit 1; }
          candidate_cut="${PINNED_CANDIDATE_CUT:?Pinned candidate cut is required}"
          [[ "${image}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo '::error::Server image must be digest-addressed.'; exit 1; }
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Server source SHA must be a full lowercase commit.'; exit 1; }
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          gh attestation verify "oci://${image}" \
            --repo honua-io/honua-server \
            --source-digest "${source_sha}" \
            --deny-self-hosted-runners \
            --format json > .certification-server-attestation.json
          image_source_revision="${source_sha}"
          if [[ "${tier}" == release ]]; then
            [[ "${seed_ref}" == "${source_sha}" ]] || { echo '::error::Release seed revision must equal source SHA.'; exit 1; }
            [[ -n "${release_cut}" && "${expected_fixture_revision}" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo '::error::Release cut and fixture SHA-256 are required.'; exit 1; }
          fi
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "tier=${tier}"
            echo "image=${image}"
            echo "source-sha=${source_sha}"
            echo "seed-ref=${seed_ref}"
            echo "expected-fixture-revision=${expected_fixture_revision}"
            echo "image-source-revision=${image_source_revision}"
            echo "release-cut=${release_cut}"
            echo "candidate-cut=${candidate_cut}"
            echo "started-at=${started_at}"
          } >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/setup-dotnet-and-nuget
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and verify exact installed SDK package
        id: sdk-package
        shell: bash
        run: |
          mkdir -p artifacts/package
          python3 scripts/prepare-installed-package-certification.py \
            --pins certification/candidate-pins.json \
            --tier "${{ steps.identity.outputs.tier }}" \
            --server-image "${{ steps.identity.outputs.image }}" \
            --server-source-sha "${{ steps.identity.outputs.source-sha }}" \
            --fixture-revision "${{ steps.identity.outputs.expected-fixture-revision }}" \
            --release-cut "${{ steps.identity.outputs.release-cut }}" \
            --output "${RUNNER_TEMP}/honua-sdk-installed-consumer" \
            --identity-output artifacts/package/installed-package.json
          echo "project=${RUNNER_TEMP}/honua-sdk-installed-consumer/Honua.Sdk.InstalledCertification.csproj" >> "${GITHUB_OUTPUT}"

      - name: Validate operation ledger
        run: python3 scripts/generate-sdk-certification.py --check

      - name: Fetch exact seed
        id: seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_REF: ${{ steps.identity.outputs.seed-ref }}
          TIER: ${{ steps.identity.outputs.tier }}
          EXPECTED_FIXTURE_REVISION: ${{ steps.identity.outputs.expected-fixture-revision }}
          PGPASSWORD: honua
        run: |
          mkdir -p .certification
          gh api "repos/honua-io/honua-server/contents/tests/seed/base-schema.sql?ref=${SEED_REF}" \
            -H "Accept: application/vnd.github.raw" > .certification/base-schema.sql
          fixture_revision="sha256:$(sha256sum .certification/base-schema.sql | cut -d' ' -f1)"
          if [[ "${TIER}" == release && "${fixture_revision}" != "${EXPECTED_FIXTURE_REVISION}" ]]; then
            echo "::error::Applied fixture digest does not match the independently pinned release fixture."
            exit 1
          fi
          echo "fixture-revision=${fixture_revision}" >> "${GITHUB_OUTPUT}"
          # Extensions only. The seed's tables are applied after migrations; loading
          # them first trips the candidate's schema-floor check and never becomes ready.
          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_raster;"

      - name: Start exact honua-server image
        env:
          SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          CERT_TIER: ${{ steps.identity.outputs.tier }}
          EVENT_NAME: ${{ github.event_name }}
          # Governed signed license: exposed to this step only for an explicit release dispatch.
          # Unconfigured until an operator provisions it; pr/nightly never receive it.
          HONUA_CERTIFICATION_LICENSE_CONTENT: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'release' && secrets.HONUA_CERTIFICATION_LICENSE_CONTENT || '' }}
        run: |
          entitlement_profile="$(python3 scripts/observe-certification-entitlement.py profile --tier "${CERT_TIER}" --event "${EVENT_NAME}")"
          entitlement_mode="$(jq -er '.mode' <<< "${entitlement_profile}")"
          dev_grant="$(jq -er '.devGrantEdition | strings' <<< "${entitlement_profile}")"
          # pr/nightly: Disabled, the 2026.1 mode (#472). release: Enabled with the signed license.
          licensing_mode="$(jq -er '.licensingMode | select(. == "Disabled" or . == "Enabled")' <<< "${entitlement_profile}")"
          echo "HONUA_ENTITLEMENT_MODE=${entitlement_mode}" >> "${GITHUB_ENV}"
          key="$(head -c 32 /dev/urandom | base64)"
          salt="$(head -c 16 /dev/urandom | base64)"
          docker run -d --name honua-server --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Licensing__Mode="${licensing_mode}" \
            -e Licensing__DevGrantEdition="${dev_grant}" \
            -e Licensing__LicenseContent="${HONUA_CERTIFICATION_LICENSE_CONTENT}" \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=honua" \
            -e Security__ConnectionEncryption__MasterKey="${key}" \
            -e Security__ConnectionEncryption__Salt="${salt}" \
            -e HONUA_ADMIN_PASSWORD="ci-protocol-api-key" \
            -e Kestrel__Endpoints__Http__Url="http://+:8080" \
            -e Kestrel__Endpoints__Http__Protocols="Http1" \
            -e Kestrel__Endpoints__Grpc__Url="http://+:8081" \
            -e Kestrel__Endpoints__Grpc__Protocols="Http2" \
            "${SERVER_IMAGE}"
          for i in $(seq 1 60); do
            [[ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz/ready || true)" == 200 ]] && exit 0
            sleep 3
          done
          docker logs honua-server || true
          exit 1

      - name: Apply exact seed
        env:
          PGPASSWORD: honua
        run: psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -f .certification/base-schema.sql

      - name: Retain candidate entitlement observation
        env:
          CERT_TIER: ${{ steps.identity.outputs.tier }}
          EVENT_NAME: ${{ github.event_name }}
          HONUA_PROTOCOL_API_KEY: "ci-protocol-api-key"
          # Only the profile check needs the signed envelope; it is never written to artifacts.
          HONUA_CERTIFICATION_LICENSE_CONTENT: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'release' && secrets.HONUA_CERTIFICATION_LICENSE_CONTENT || '' }}
        run: |
          python3 scripts/observe-certification-entitlement.py observe \
            --tier "${CERT_TIER}" --event "${EVENT_NAME}" --mode "${HONUA_ENTITLEMENT_MODE}" \
            --base-url http://localhost:8080 --output artifacts/evidence/entitlement-observation.json

      - name: Run public SDK operations
        id: tests
        env:
          TIER: ${{ steps.identity.outputs.tier }}
          HONUA_PROTOCOL_INTEGRATION: "true"
          HONUA_PROTOCOL_EXTERNAL_BASE_URL: "http://localhost:8080"
          HONUA_PROTOCOL_GRPC_BASE_URL: "http://localhost:8081"
          HONUA_PROTOCOL_WFS_TYPENAME: "honua:test_layer"
          HONUA_PROTOCOL_API_KEY: "ci-protocol-api-key"
          HONUA_PROTOCOL_DESTRUCTIVE: ${{ steps.identity.outputs.tier != 'pr' && 'true' || 'false' }}
          # pr/nightly run edits with licensing disabled, as 2026.1 does (never release proof); release needs the
          # governed signed license. The flag only allows the test to execute; a 402 or any other
          # failure is not a pass, and licensed passes need the retained signed observation.
          HONUA_PROTOCOL_FEATURESERVER_EDITS_SUPPORTED: "true"
          HONUA_PROTOCOL_FEATURESERVER_EDIT_ADD_ATTRIBUTES_JSON: '{"name":"sdk-certification-add"}'
          HONUA_PROTOCOL_FEATURESERVER_EDIT_UPDATE_ATTRIBUTES_JSON: '{"name":"sdk-certification-update"}'
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          filter='FullyQualifiedName~GrpcQuery_IsBoundedAndCanOmitGeometry|FullyQualifiedName~FeatureServer_Metadata_QueryStatisticsAndVectorPayload_AreReachable|FullyQualifiedName~FeatureServer_SourceMetadata_ReturnsConfiguredServiceAndLayer|FullyQualifiedName~OgcCollections_Items_Queryables_AndSingleItem_AreReachable'
          conformance_filter='FullyQualifiedName~GrpcQueryFeatures_RoundTripsCanonicalResponseShape|FullyQualifiedName~GrpcQuery_GeometryOmission_IsHonored|FullyQualifiedName~FeatureServerQuery_RoundTripsCanonicalAttributeProjection|FullyQualifiedName~OgcItems_RoundTripCanonicalPropertyProjection'
          if [[ "${TIER}" != pr ]]; then
            filter='Category=ProtocolIntegration'
            conformance_filter='FullyQualifiedName~LiveConformanceTests'
          fi
          protocol_code=0
          dotnet test "${{ steps.sdk-package.outputs.project }}" \
            --configuration Release \
            --no-restore \
            --filter "${filter}" \
            --logger 'trx;LogFileName=protocol-integration.trx' \
            --results-directory artifacts/test-results || protocol_code=$?
          conformance_code=0
          dotnet test "${{ steps.sdk-package.outputs.project }}" \
            --configuration Release \
            --no-restore \
            --filter "${conformance_filter}" \
            --logger 'trx;LogFileName=live-conformance.trx' \
            --results-directory artifacts/test-results || conformance_code=$?
          echo "protocol_exit_code=${protocol_code}" >> "${GITHUB_OUTPUT}"
          echo "conformance_exit_code=${conformance_code}" >> "${GITHUB_OUTPUT}"

      - name: Emit and enforce normalized certification evidence
        if: always()
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TIER: ${{ inputs.tier }}
          SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          SEED_REF: ${{ steps.identity.outputs.seed-ref }}
          FIXTURE_REVISION: ${{ steps.seed.outputs.fixture-revision }}
          IMAGE_SOURCE_REVISION: ${{ steps.identity.outputs.image-source-revision }}
          SDK_VERSION: ${{ env.PINNED_SDK_PACKAGE_VERSION }}
          SDK_PACKAGE_ID: ${{ env.PINNED_SDK_PACKAGE_ID }}
          SDK_PACKAGE_DIGEST: ${{ env.PINNED_SDK_PACKAGE_DIGEST }}
          SDK_PACKAGE_SOURCE_SHA: ${{ env.PINNED_SDK_PACKAGE_SOURCE_SHA }}
          RELEASE_CUT: ${{ steps.identity.outputs.release-cut }}
          STARTED_AT: ${{ steps.identity.outputs.started-at }}
          ENTITLEMENT_OBSERVATION: artifacts/evidence/entitlement-observation.json
          SDK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # honua-release nightly correlation: with GITHUB_RUN_ID/RUN_ATTEMPT/REPOSITORY/WORKFLOW_REF
          # the generator records identity.producer_run in every executed receipt (RECEIPT-V2.md).
          HONUA_NIGHTLY_DISPATCH_ID: ${{ inputs.nightly_dispatch_id || '' }}
          # request-context values must match the ones the SDK operations step ran against
          HONUA_PROTOCOL_EXTERNAL_BASE_URL: "http://localhost:8080"
          HONUA_PROTOCOL_GRPC_BASE_URL: "http://localhost:8081"
        run: |
          set -euo pipefail
          tier="${TIER}"
          if [[ -z "${tier}" ]]; then
            case "${EVENT_NAME}" in
              schedule) tier=nightly ;;
              pull_request) tier=pr ;;
              workflow_dispatch) tier="${INPUT_TIER:-nightly}" ;;
              *) tier=pr ;;
            esac
          fi
          [[ "${tier}" == pr || "${tier}" == nightly || "${tier}" == release ]] || {
            echo "::error::Certification tier must be pr, nightly, or release."
            exit 1
          }
          # Declare operations from the installed package's own source, not this checkout:
          # the governed catalog lists the operations the pinned package ships.
          [[ "${SDK_PACKAGE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Installed package source SHA must be a full lowercase commit."
            exit 1
          }
          operations_root="${RUNNER_TEMP}/installed-package-source"
          rm -rf "${operations_root}"
          mkdir -p "${operations_root}"
          git fetch --no-tags --depth=1 origin "${SDK_PACKAGE_SOURCE_SHA}"
          git archive "${SDK_PACKAGE_SOURCE_SHA}" src | tar -x -C "${operations_root}"
          python3 scripts/generate-sdk-certification.py \
            --tier "${tier}" \
            --operations-source-root "${operations_root}/src" \
            --requirements artifacts/governance/protocol-certification-requirements.v1.json \
            --requirements-revision "$(python3 -c 'import json; print(json.load(open("artifacts/governance/source-binding.json"))["requirementsRevision"])')" \
            --trx artifacts/test-results/protocol-integration.trx \
            --trx artifacts/test-results/live-conformance.trx \
            --trx-exit-code "${{ steps.tests.outputs.protocol_exit_code }}" \
            --trx-exit-code "${{ steps.tests.outputs.conformance_exit_code }}" \
            --evidence artifacts/evidence/sdk-certification.json \
            --started-at "${STARTED_AT}" \
            --sdk-commit "${SDK_COMMIT}" \
            --sdk-version "${SDK_VERSION}" \
            --sdk-package-id "${SDK_PACKAGE_ID}" \
            --sdk-package-digest "${SDK_PACKAGE_DIGEST}" \
            --sdk-package-source-sha "${SDK_PACKAGE_SOURCE_SHA}" \
            --server-source-sha "${SERVER_SOURCE_SHA}" \
            --image-source-revision "${IMAGE_SOURCE_REVISION}" \
            --server-image "${SERVER_IMAGE}" \
            --seed-revision "${SEED_REF}" \
            --fixture-revision "${FIXTURE_REVISION}" \
            --candidate-cut "${{ steps.identity.outputs.candidate-cut }}" \
            --evidence-uri "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --base-url "${HONUA_PROTOCOL_EXTERNAL_BASE_URL}" \
            --grpc-base-url "${HONUA_PROTOCOL_GRPC_BASE_URL}" \
            --service-id "${HONUA_PROTOCOL_SERVICE_NAME}" \
            --layer-id "${HONUA_PROTOCOL_LAYER_ID}" \
            --collection-id "${HONUA_PROTOCOL_OGC_COLLECTION_ID}" \
            --allow-nonpass \
            ${ENTITLEMENT_OBSERVATION:+--entitlement-observation "${ENTITLEMENT_OBSERVATION}"} \
            ${RELEASE_CUT:+--release-cut "${RELEASE_CUT}"}

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-sdk-${{ steps.identity.outputs.tier }}-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ steps.identity.outputs.tier == 'release' && 180 || steps.identity.outputs.tier == 'nightly' && 30 || 14 }}
