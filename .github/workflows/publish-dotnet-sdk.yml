name: Publish .NET SDK Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build and validation only (skip publish)"
        required: false
        default: true
        type: boolean
      run_staging:
        description: "Also run staging integration during a dry run (non-dry publishes always require it)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "dotnet-sdk-v*"

env:
  DOTNET_VERSION: "10.0.100"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

concurrency:
  group: publish-dotnet-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.value }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind workflow source to the selected revision
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checkout ${checked_out_sha} does not match workflow source ${GITHUB_SHA}."
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/dotnet-sdk-v* ]]; then
            tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            if [[ "${tag_sha}" != "${checked_out_sha}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} resolves to ${tag_sha}, not ${checked_out_sha}."
              exit 1
            fi
            if ! git show-ref --verify --quiet refs/remotes/origin/trunk; then
              echo "::error::The fetched repository has no origin/trunk ref."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${checked_out_sha}" refs/remotes/origin/trunk; then
              echo "::error::Release tag ${GITHUB_REF_NAME} is not on origin/trunk."
              exit 1
            fi
          fi

      - name: Validate shipped package inventory
        run: scripts/validate-package-inventory.sh

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ github.repository }}-${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify pinned .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(dotnet --version)"
          if [[ "${actual_version}" != "${DOTNET_VERSION}" ]]; then
            echo "::error::setup-dotnet resolved ${actual_version}; expected ${DOTNET_VERSION}."
            exit 1
          fi

      - name: Configure GitHub Packages
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Validate package versions
        id: package-version
        env:
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        shell: bash
        run: |
          mapfile -t projects < <(
            awk -F'|' '!/^[[:space:]]*(#|$)/ { print $1 }' \
              eng/shipped-packages.txt
          )

          errors=0
          package_version=""

          get_package_version() {
            dotnet msbuild "$1" -nologo -getProperty:PackageVersion
          }

          for project in "${projects[@]}"; do
            version="$(get_package_version "${project}")"
            if [[ -z "${version}" ]]; then
              echo "Could not resolve PackageVersion for ${project}."
              errors=1
              continue
            fi

            if [[ -z "${package_version}" ]]; then
              package_version="${version}"
            elif [[ "${package_version}" != "${version}" ]]; then
              echo "Package version mismatch: ${project} has ${version}; expected ${package_version}."
              errors=1
            fi
          done

          if [[ "${GITHUB_REF}" == refs/tags/dotnet-sdk-v* ]]; then
            tag_version="${GITHUB_REF_NAME#dotnet-sdk-v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag version (${tag_version}) does not match package version (${package_version})."
              errors=1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_DRY_RUN}" != "true" ]]; then
            echo "Non-dry publication is restricted to a dotnet-sdk-v<PackageVersion> tag. Select the matching tag when manually rerunning a release."
            errors=1
          fi

          if [[ ${errors} -ne 0 ]]; then
            exit 1
          fi

          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          echo "value=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate stable nuget.org prerequisites
        if: >-
          ${{
            !contains(steps.package-version.outputs.value, '-') &&
            !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
          }}
        run: |
          python scripts/check-nuget-org-prerequisites.py \
            --dependency-manifest Directory.Packages.props \
            --evidence-out stable-nuget-org-prerequisites.json

      - name: Upload stable nuget.org prerequisite evidence
        if: >-
          ${{
            always() &&
            !contains(steps.package-version.outputs.value, '-') &&
            !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-nuget-org-prerequisites
          path: stable-nuget-org-prerequisites.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Build SDK packages
        shell: bash
        run: |
          mapfile -t projects < <(
            awk -F'|' '!/^[[:space:]]*(#|$)/ { print $1 }' \
              eng/shipped-packages.txt
          )

          for project in "${projects[@]}"; do
            dotnet build "${project}" --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          done

      - name: Test SDK packages
        shell: bash
        run: |
          projects=(
            "tests/Honua.Sdk.Abstractions.Tests/Honua.Sdk.Abstractions.Tests.csproj"
            "tests/Honua.Sdk.Admin.Tests/Honua.Sdk.Admin.Tests.csproj"
            "tests/Honua.Sdk.Processes.Tests/Honua.Sdk.Processes.Tests.csproj"
            "tests/Honua.Sdk.Geometry.Tests/Honua.Sdk.Geometry.Tests.csproj"
            "tests/Honua.Sdk.Spec.Tests/Honua.Sdk.Spec.Tests.csproj"
            "tests/Honua.Sdk.Grpc.Tests/Honua.Sdk.Grpc.Tests.csproj"
            "tests/Honua.Sdk.GeoServices.Tests/Honua.Sdk.GeoServices.Tests.csproj"
            "tests/Honua.Sdk.Scenes.Tests/Honua.Sdk.Scenes.Tests.csproj"
            "tests/Honua.Sdk.Field.Tests/Honua.Sdk.Field.Tests.csproj"
            "tests/Honua.Sdk.OgcFeatures.Tests/Honua.Sdk.OgcFeatures.Tests.csproj"
            "tests/Honua.Sdk.OgcFeatures.WfsTests/Honua.Sdk.OgcFeatures.WfsTests.csproj"
            "tests/Honua.Sdk.Catalogs.RecordsTests/Honua.Sdk.Catalogs.RecordsTests.csproj"
            "tests/Honua.Sdk.Catalogs.StacTests/Honua.Sdk.Catalogs.StacTests.csproj"
            "tests/Honua.Sdk.Offline.Tests/Honua.Sdk.Offline.Tests.csproj"
            "tests/Honua.Sdk.Studio.Tests/Honua.Sdk.Studio.Tests.csproj"
            "tests/Honua.Sdk.ConsoleShare.Tests/Honua.Sdk.ConsoleShare.Tests.csproj"
            "tests/Honua.Sdk.Cli.Tests/Honua.Sdk.Cli.Tests.csproj"
            "tests/Honua.Sdk.MetaSmoke.Tests/Honua.Sdk.MetaSmoke.Tests.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet test "${project}" --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          done

      - name: Build canonical sample
        run: dotnet build examples/AdminBootstrapConsole/AdminBootstrapConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build spec plan apply sample
        run: dotnet build examples/SpecPlanApplyConsole/SpecPlanApplyConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build studio analysis report sample
        run: dotnet build examples/StudioAnalysisReportConsole/StudioAnalysisReportConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build realtime worker sample
        run: dotnet build examples/RealtimeWorker/RealtimeWorker.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build routing geofence sample
        run: dotnet build examples/RoutingGeofenceConsole/RoutingGeofenceConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build field data reference sample
        run: dotnet build examples/FieldDataCollection/FieldDataCollection.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Test canonical sample workflow
        run: dotnet test tests/AdminBootstrapConsole.Tests/AdminBootstrapConsole.Tests.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Test deterministic demo suite
        run: dotnet test tests/DemoSuite.Tests/DemoSuite.Tests.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Validate package API compatibility
        shell: bash
        run: |
          baseline_ref="HEAD~1"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            baseline_ref="$(git describe --tags --abbrev=0 --match 'dotnet-sdk-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [[ -z "${baseline_ref}" ]]; then
              echo "No previous dotnet-sdk-v* tag found; using HEAD~1 as the API compatibility baseline."
              baseline_ref="HEAD~1"
            fi
          fi

          scripts/validate-api-compat.sh "${baseline_ref}"

      - name: Security audit (NuGet dependencies)
        shell: bash
        run: |
          mapfile -t projects < <(
            awk -F'|' '!/^[[:space:]]*(#|$)/ { print $1 }' \
              eng/shipped-packages.txt
          )

          errors=0

          for project in "${projects[@]}"; do
            output_file="/tmp/$(basename "${project}").audit.txt"
            dotnet list "${project}" package --vulnerable --include-transitive 2>&1 | tee "${output_file}"

            if grep -qi "has the following vulnerable packages" "${output_file}"; then
              echo "::error::Vulnerable NuGet dependencies detected in ${project}. Fix before publishing."
              errors=1
            fi
          done

          if [[ ${errors} -ne 0 ]]; then
            exit 1
          fi

      - name: Pack NuGet packages
        shell: bash
        run: |
          mkdir -p ./nupkgs
          mapfile -t projects < <(
            awk -F'|' '!/^[[:space:]]*(#|$)/ { print $1 }' \
              eng/shipped-packages.txt
          )

          for project in "${projects[@]}"; do
            dotnet pack "${project}" --configuration Release --no-build -o ./nupkgs
          done

          shopt -s nullglob
          primary_packages=(./nupkgs/*.nupkg)
          symbol_packages=(./nupkgs/*.snupkg)
          expected_count="${#projects[@]}"
          if [[ ${#primary_packages[@]} -ne ${expected_count} ]]; then
            echo "::error::Expected ${expected_count} primary packages, found ${#primary_packages[@]}."
            exit 1
          fi
          if [[ ${#symbol_packages[@]} -ne ${expected_count} ]]; then
            echo "::error::Expected ${expected_count} symbol packages, found ${#symbol_packages[@]}."
            exit 1
          fi

      - name: Generate CycloneDX SBOM per package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./sboms
          dotnet tool update --global CycloneDX --version 4.2.0 >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"

          mapfile -t projects < <(
            awk -F'|' '!/^[[:space:]]*(#|$)/ { print $1 }' \
              eng/shipped-packages.txt
          )

          for project in "${projects[@]}"; do
            pkg_id="$(basename "$(dirname "${project}")")"
            dotnet CycloneDX "${project}" \
              --json \
              --output "./sboms/${pkg_id}" \
              --filename "${pkg_id}.cdx.json"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-sboms
          path: ./sboms/**/*.cdx.json
          if-no-files-found: error
          overwrite: true

      - name: Package signing boundary notice
        run: |
          echo "::notice::Release smoke emits unsigned inputs only. Signing credentials are read later, inside the protected public-nuget environment."

      - name: Package install smoke
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT

          dotnet new console --framework net10.0 --output "${smoke_dir}"

          pushd "${smoke_dir}" >/dev/null

          cat > NuGet.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-sdk" value="${GITHUB_WORKSPACE}/nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local-sdk">
                <package pattern="Honua.Sdk" />
                <package pattern="Honua.Sdk.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          dotnet add package Microsoft.Extensions.Hosting --version 10.0.0
          while IFS='|' read -r project_path package_id; do
            if grep -q "<PackAsTool>true</PackAsTool>" "${GITHUB_WORKSPACE}/${project_path}"; then
              # DotnetTool packages cannot be referenced as libraries (NU1212);
              # smoke them through the tool installer instead.
              tool_dir="$(mktemp -d)"
              dotnet tool install "${package_id}" \
                --tool-path "${tool_dir}" \
                --version "${PACKAGE_VERSION}" \
                --configfile NuGet.config
              dotnet tool list --tool-path "${tool_dir}" | grep -Fiq "${package_id}"
              rm -rf "${tool_dir}"
            else
              dotnet add package "${package_id}" --version "${PACKAGE_VERSION}"
            fi
          done < <(
            grep -Ev '^[[:space:]]*(#|$)' \
              "${GITHUB_WORKSPACE}/eng/shipped-packages.txt"
          )

          cat <<'EOF' > Program.cs
          using Honua.Sdk;
          using Honua.Sdk.Abstractions.Features;
          using Honua.Sdk.Admin;
          using Honua.Sdk.Admin.Extensions;
          using Honua.Sdk.Admin.Geocoding;
          using Honua.Sdk.Processes;
          using Honua.Sdk.Processes.Extensions;
          using Honua.Sdk.Processes.Models;
          using Honua.Sdk.Geometry;
          using Honua.Sdk.Spec;
          using Honua.Sdk.Spec.Extensions;
          using Honua.Sdk.Spec.Models;
          using Honua.Sdk.GeoServices.Extensions;
          using Honua.Sdk.GeoServices.FeatureServer;
          using Honua.Sdk.GeoServices.FeatureServer.Models;
          using Honua.Sdk.Abstractions.Scenes;
          using Honua.Sdk.Scenes;
          using Honua.Sdk.Scenes.Extensions;
          using Honua.Sdk.Field.Forms;
          using Honua.Sdk.Field.Records;
          using Honua.Sdk.Grpc;
          using Honua.Sdk.Grpc.Extensions;
          using Honua.Sdk.Grpc.Models;
          using Honua.Sdk.Offline;
          using Honua.Sdk.Offline.Abstractions;
          using Honua.Sdk.OgcFeatures;
          using Honua.Sdk.OgcFeatures.Extensions;
          using Honua.Sdk.OgcFeatures.Models;
          using Honua.Sdk.Catalogs.Records;
          using Honua.Sdk.Catalogs.Records.Extensions;
          using Honua.Sdk.Catalogs.Records.Models;
          using Honua.Sdk.Catalogs.Stac;
          using Honua.Sdk.Catalogs.Stac.Extensions;
          using Honua.Sdk.Catalogs.Stac.Models;
          using Honua.Sdk.OgcFeatures.Wfs;
          using Honua.Sdk.OgcFeatures.Wfs.Extensions;
          using Honua.Sdk.OgcFeatures.Wfs.Models;
          using Honua.Sdk.Studio;
          using Honua.Sdk.Studio.Extensions;
          using Honua.Sdk.ConsoleShare;
          using Honua.Sdk.ConsoleShare.Extensions;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.Hosting;

          var builder = Host.CreateApplicationBuilder(args);
          var baseUri = new Uri("https://example.honua.test");

          // Exercise the umbrella facade once to confirm the meta package is
          // resolvable + AddHonua wires up. Use a throwaway service collection
          // so it doesn't conflict with the per-package registrations below
          // (those exercise the narrow extensions on the same project).
          var metaSmokeServices = new ServiceCollection();
          metaSmokeServices.AddHonua(o =>
          {
              o.BaseAddress = baseUri;
              o.EnableRetry = false;
          });
          using (var metaProvider = metaSmokeServices.BuildServiceProvider())
          {
              _ = metaProvider.GetRequiredService<IHonuaGrpcClient>();
              _ = metaProvider.GetRequiredService<IHonuaAdminClient>();
              _ = metaProvider.GetRequiredService<IHonuaOgcFeaturesClient>();
              _ = metaProvider.GetRequiredService<IHonuaProcessesClient>();
          }

          builder.Services.AddHonuaAdmin(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaGeocoding(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaProcesses(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaSpec(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaGrpc(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaWfs(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaFeatureServer(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaScenes(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaOgcFeatures(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaOgcRecords(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaStac(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaStudio(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaConsoleShare(options => options.BaseAddress = baseUri);

          using var host = builder.Build();

          _ = host.Services.GetRequiredService<IHonuaAdminClient>();
          _ = host.Services.GetRequiredService<IHonuaGeocodingClient>();
          _ = host.Services.GetRequiredService<IHonuaProcessesClient>();
          _ = host.Services.GetRequiredService<IHonuaSpecClient>();
          _ = host.Services.GetRequiredService<IHonuaGrpcClient>();
          _ = host.Services.GetRequiredService<IHonuaWfsClient>();
          _ = host.Services.GetRequiredService<IHonuaFeatureServerClient>();
          _ = host.Services.GetRequiredService<IHonuaSceneClient>();
          _ = host.Services.GetRequiredService<IHonuaOgcFeaturesClient>();
          _ = host.Services.GetRequiredService<IHonuaOgcRecordsClient>();
          _ = host.Services.GetRequiredService<IHonuaStacClient>();
          _ = host.Services.GetRequiredService<IHonuaStudioReportsClient>();
          _ = host.Services.GetRequiredService<IHonuaConsoleShareClient>();
          _ = host.Services.GetServices<IHonuaFeatureQueryClient>().ToArray();
          _ = HonuaSpatialReference.Wgs84;

          _ = new Honua.Sdk.Grpc.Models.QueryFeaturesRequest
          {
              ServiceId = "sdk_demo",
              LayerId = 0,
              ResultRecordCount = 1,
              ReturnGeometry = false
          };

          _ = new HonuaProcessExecuteRequest
          {
              Inputs = new HonuaProcessExecuteInputs
              {
                  Plan = new HonuaAnalysisPlan
                  {
                      PlanId = "package-smoke",
                      WorkflowFamily = "analyze",
                      Steps = []
                  }
              }
          };

          _ = new SpecDocumentRequest
          {
              GrammarVersion = "spec/v1",
              ProcessFamilyVersion = "process/v1",
              Nodes =
              [
                  new SpecNodeRequest
                  {
                      Id = "source",
                      Kind = SpecResourceKind.Dataset,
                      Op = "catalog.source"
                  }
              ]
          };

          _ = new GetFeaturesRequest
          {
              TypeNames = "sdk_demo_points",
              Count = 1
          };

          _ = new FeatureServerQueryParams
          {
              Where = "1=1",
              ResultRecordCount = 1,
              ReturnGeometry = false
          };

          _ = new HonuaSceneListRequest
          {
              Capabilities = [HonuaSceneCapabilities.ThreeDimensionalTiles]
          };

          var form = new FormDefinition
          {
              FormId = "inspection",
              Name = "Inspection",
              Sections =
              [
                  new FormSection
                  {
                      SectionId = "main",
                      Label = "Main",
                      Fields =
                      [
                          new FormField { FieldId = "asset_id", Label = "Asset ID", Type = FormFieldType.Text, Required = true }
                      ]
                  }
              ]
          };

          _ = FormValidator.Validate(form, new FieldRecord
          {
              RecordId = "record-1",
              FormId = form.FormId,
              Values = { ["asset_id"] = "A-100" }
          });

          _ = new OgcItemsParams
          {
              Limit = 1
          };

          _ = new OgcRecordsQuery
          {
              Limit = 1,
              Query = "parks"
          };

          _ = new StacSearchQuery
          {
              Collections = ["imagery"],
              Limit = 1
          };

          _ = OfflineDownloadPlanner.CreatePlan(new OfflinePackageManifest
          {
              PackageId = "smoke",
              Sources =
              [
                  new OfflineSourceDescriptor
                  {
                      SourceId = "parks",
                      Source = new SourceDescriptor
                      {
                          Id = "parks",
                          Protocol = FeatureProtocolIds.OgcFeatures,
                          Locator = new SourceLocator { CollectionId = "parks" }
                      },
                      OutFields = ["name"],
                      PageSize = 10
                  }
              ]
          });
          EOF

          dotnet build --configuration Release

          popd >/dev/null

      - name: Record immutable package checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd ./nupkgs
            sha256sum -- *.nupkg *.snupkg | sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload immutable unsigned package inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages-input-unsigned
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
            ./nupkgs/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "Dry run complete. Built unsigned packages (signing secrets were not accessed):" >> "${GITHUB_STEP_SUMMARY}"
          ls -1 ./nupkgs/*.nupkg ./nupkgs/*.snupkg >> "${GITHUB_STEP_SUMMARY}"

  release-staging-integration:
    name: Release Staging Integration
    needs: release-smoke
    if: ${{ github.event_name == 'push' || github.event.inputs.run_staging == 'true' || github.event.inputs.dry_run != 'true' }}
    uses: ./.github/workflows/staging-integration.yml
    with:
      artifact-retention: 90

  publish-dotnet-packages:
    name: Publish Packages
    needs:
      - release-smoke
      - release-staging-integration
    if: >-
      ${{
        always() &&
        startsWith(github.ref, 'refs/tags/dotnet-sdk-v') &&
        needs.release-smoke.result == 'success' &&
        needs.release-staging-integration.result == 'success' &&
        !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
      }}
    runs-on: ubuntu-latest
    environment: public-nuget
    env:
      PACKAGE_VERSION: ${{ needs.release-smoke.outputs.package-version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download immutable unsigned package inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages-input-unsigned
          path: ./nupkgs-unsigned

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify pinned .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(dotnet --version)"
          if [[ "${actual_version}" != "${DOTNET_VERSION}" ]]; then
            echo "::error::setup-dotnet resolved ${actual_version}; expected ${DOTNET_VERSION}."
            exit 1
          fi

      - name: Validate immutable artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd ./nupkgs-unsigned && sha256sum --check SHA256SUMS)

      - name: Validate protected publication credentials
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NUGET_SIGNING_CERTIFICATE_BASE64 }}
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${NUGET_SIGNING_CERTIFICATE_BASE64}" ]] || missing+=(NUGET_SIGNING_CERTIFICATE_BASE64)
          [[ -n "${NUGET_SIGNING_PASSWORD}" ]] || missing+=(NUGET_SIGNING_PASSWORD)
          if [[ "${PACKAGE_VERSION}" != *-* && -z "${NUGET_API_KEY}" ]]; then
            missing+=(NUGET_API_KEY)
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::The protected public-nuget environment is missing required publication credentials: ${missing[*]}."
            exit 1
          fi

      - name: Sign release packages inside the protected environment
        env:
          NUGET_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NUGET_SIGNING_CERTIFICATE_BASE64 }}
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
          NUGET_SIGNING_TIMESTAMP_URL: ${{ vars.NUGET_SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./nupkgs
          cp ./nupkgs-unsigned/*.nupkg ./nupkgs/
          cp ./nupkgs-unsigned/*.snupkg ./nupkgs/

          cert_path="$(mktemp --suffix=.pfx)"
          trap 'shred -u "${cert_path}" 2>/dev/null || rm -f "${cert_path}"; dotnet nuget trust remove honua-sdk-release >/dev/null 2>&1 || true' EXIT
          echo "${NUGET_SIGNING_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"

          package_files=(./nupkgs/*.nupkg ./nupkgs/*.snupkg)
          for package_file in "${package_files[@]}"; do
            dotnet nuget sign "${package_file}" \
              --certificate-path "${cert_path}" \
              --certificate-password "${NUGET_SIGNING_PASSWORD}" \
              --timestamper "${NUGET_SIGNING_TIMESTAMP_URL}"
          done

          nupkg_files=(./nupkgs/*.nupkg)
          dotnet nuget trust author honua-sdk-release "${nupkg_files[0]}" --allow-untrusted-root
          for package_file in "${package_files[@]}"; do
            dotnet nuget verify --all "${package_file}"
          done

          (
            cd ./nupkgs
            sha256sum -- *.nupkg *.snupkg | sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Select nuget.org artifact set
        id: nugetorg-artifacts
        shell: bash
        run: |
          set -euo pipefail
          publicly_verified=true
          for package_file in ./nupkgs/*.nupkg ./nupkgs/*.snupkg; do
            if ! dotnet nuget verify --all "${package_file}"; then
              publicly_verified=false
              break
            fi
          done

          if [[ "${publicly_verified}" == "true" ]]; then
            echo "set=signed" >> "${GITHUB_OUTPUT}"
          else
            echo "set=unsigned" >> "${GITHUB_OUTPUT}"
            echo "::warning::The author certificate is not publicly chained. nuget.org will receive the immutable unsigned input and repository-sign it; GitHub Packages still receives the signed set."
          fi

      - name: Upload signed release package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages-signed
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
            ./nupkgs/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Preflight every immutable registry coordinate
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coordinate-evidence

          if [[ "${PACKAGE_VERSION}" != *-* ]]; then
            source_dir="./nupkgs"
            if [[ "${{ steps.nugetorg-artifacts.outputs.set }}" != "signed" ]]; then
              source_dir="./nupkgs-unsigned"
            fi
            python scripts/check-package-coordinates.py \
              --registry-name nuget.org \
              --service-index https://api.nuget.org/v3/index.json \
              --symbol-package-base-address https://globalcdn.nuget.org/symbol-packages/ \
              --package-dir "${source_dir}" \
              --inventory eng/shipped-packages.txt \
              --package-version "${PACKAGE_VERSION}" \
              --source-revision "${GITHUB_SHA}" \
              --evidence-out coordinate-evidence/nuget-org-preflight.json \
              --publish-list-out coordinate-evidence/nuget-org-publish-list.txt \
              --symbol-publish-list-out coordinate-evidence/nuget-org-symbol-publish-list.txt
          fi

          python scripts/check-package-coordinates.py \
            --registry-name github-packages \
            --service-index https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --username "${{ github.actor }}" \
            --token-env GITHUB_PACKAGES_TOKEN \
            --package-dir ./nupkgs \
            --inventory eng/shipped-packages.txt \
            --package-version "${PACKAGE_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --evidence-out coordinate-evidence/github-packages-preflight.json \
            --publish-list-out coordinate-evidence/github-packages-publish-list.txt

      - name: Publish stable packages to nuget.org
        if: ${{ !contains(needs.release-smoke.outputs.package-version, '-') }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          ARTIFACT_SET: ${{ steps.nugetorg-artifacts.outputs.set }}
        run: |
          if [[ "${ARTIFACT_SET}" != "signed" ]]; then
            echo "::notice::Pushing the unsigned package set to nuget.org (author certificate is not publicly chained); nuget.org repository-signs every upload."
          fi
          while IFS= read -r package_file; do
            [[ -n "${package_file}" ]] || continue
            dotnet nuget push "${package_file}" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${NUGET_API_KEY}" \
              --no-symbols
          done < coordinate-evidence/nuget-org-publish-list.txt

      - name: Verify stable packages from nuget.org
        if: ${{ !contains(needs.release-smoke.outputs.package-version, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT
          source_dir="./nupkgs"
          if [[ "${{ steps.nugetorg-artifacts.outputs.set }}" != "signed" ]]; then
            source_dir="./nupkgs-unsigned"
          fi
          python scripts/check-package-coordinates.py \
            --registry-name nuget.org \
            --service-index https://api.nuget.org/v3/index.json \
            --package-dir "${source_dir}" \
            --inventory eng/shipped-packages.txt \
            --package-version "${PACKAGE_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --evidence-out coordinate-evidence/nuget-org-public-proof.json \
            --require-present \
            --attempts 30 \
            --delay-seconds 30

          cat > "${smoke_root}/NuGet.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF

          for package_id in Honua.Sdk Honua.Sdk.Admin Honua.Sdk.Grpc; do
            project_dir="${smoke_root}/${package_id}"
            dotnet new console --framework net10.0 --output "${project_dir}" --no-restore
            project_file="$(find "${project_dir}" -maxdepth 1 -name '*.csproj' -print -quit)"
            test -n "${project_file}"
            dotnet add "${project_file}" package "${package_id}" --version "${PACKAGE_VERSION}" --no-restore
            dotnet restore "${project_file}" --configfile "${smoke_root}/NuGet.config" --no-cache --force-evaluate
            dotnet build "${project_file}" --configuration Release --no-restore
          done

          dotnet tool install Honua.Sdk.Cli \
            --tool-path "${smoke_root}/tools" \
            --version "${PACKAGE_VERSION}" \
            --configfile "${smoke_root}/NuGet.config"
          "${smoke_root}/tools/honua" doctor --help >/dev/null
          echo "Indexed every package and installed the umbrella, Admin/Grpc leaves, and CLI using only nuget.org." >> "${GITHUB_STEP_SUMMARY}"

      - name: Submit portable symbol packages to nuget.org
        if: ${{ !contains(needs.release-smoke.outputs.package-version, '-') }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="./nupkgs"
          if [[ "${{ steps.nugetorg-artifacts.outputs.set }}" != "signed" ]]; then
            source_dir="./nupkgs-unsigned"
          fi
          while IFS= read -r symbol_package; do
            [[ -n "${symbol_package}" ]] || continue
            dotnet nuget push "${symbol_package}" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${NUGET_API_KEY}"
          done < coordinate-evidence/nuget-org-symbol-publish-list.txt

      - name: Verify portable symbol packages from nuget.org
        if: ${{ !contains(needs.release-smoke.outputs.package-version, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="./nupkgs"
          if [[ "${{ steps.nugetorg-artifacts.outputs.set }}" != "signed" ]]; then
            source_dir="./nupkgs-unsigned"
          fi
          python scripts/check-package-coordinates.py \
            --registry-name nuget.org \
            --service-index https://api.nuget.org/v3/index.json \
            --symbol-package-base-address https://globalcdn.nuget.org/symbol-packages/ \
            --package-dir "${source_dir}" \
            --inventory eng/shipped-packages.txt \
            --package-version "${PACKAGE_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --evidence-out coordinate-evidence/nuget-org-symbol-proof.json \
            --require-present \
            --attempts 60 \
            --delay-seconds 15

      - name: Publish to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package_file; do
            [[ -n "${package_file}" ]] || continue
            dotnet nuget push "${package_file}" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${GITHUB_PACKAGES_TOKEN}" \
              --no-symbols
          done < coordinate-evidence/github-packages-publish-list.txt

      - name: Verify GitHub Packages payloads
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python scripts/check-package-coordinates.py \
            --registry-name github-packages \
            --service-index https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --username "${{ github.actor }}" \
            --token-env GITHUB_PACKAGES_TOKEN \
            --package-dir ./nupkgs \
            --inventory eng/shipped-packages.txt \
            --package-version "${PACKAGE_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --evidence-out coordinate-evidence/github-packages-proof.json \
            --require-present \
            --attempts 30 \
            --delay-seconds 10

      - name: Upload registry publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-registry-proof
          path: coordinate-evidence/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
