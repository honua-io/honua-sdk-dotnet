name: Publish .NET SDK Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build and validation only (skip publish)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "dotnet-sdk-v*"

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ github.repository }}-${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Validate package versions
        shell: bash
        run: |
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.Wfs/Honua.Sdk.Wfs.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
          )

          errors=0
          package_version=""

          get_package_version() {
            dotnet msbuild "$1" -nologo -getProperty:PackageVersion
          }

          for project in "${projects[@]}"; do
            version="$(get_package_version "${project}")"
            if [[ -z "${version}" ]]; then
              echo "Could not resolve PackageVersion for ${project}."
              errors=1
              continue
            fi

            if [[ -z "${package_version}" ]]; then
              package_version="${version}"
            elif [[ "${package_version}" != "${version}" ]]; then
              echo "Package version mismatch: ${project} has ${version}; expected ${package_version}."
              errors=1
            fi
          done

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#dotnet-sdk-v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag version (${tag_version}) does not match package version (${package_version})."
              errors=1
            fi
          fi

          if [[ ${errors} -ne 0 ]]; then
            exit 1
          fi

          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Build SDK packages
        shell: bash
        run: |
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.Wfs/Honua.Sdk.Wfs.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet build "${project}" --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          done

      - name: Test SDK packages
        shell: bash
        run: |
          projects=(
            "tests/Honua.Sdk.Admin.Tests/Honua.Sdk.Admin.Tests.csproj"
            "tests/Honua.Sdk.Grpc.Tests/Honua.Sdk.Grpc.Tests.csproj"
            "tests/Honua.Sdk.Wfs.Tests/Honua.Sdk.Wfs.Tests.csproj"
            "tests/Honua.Sdk.GeoServices.Tests/Honua.Sdk.GeoServices.Tests.csproj"
            "tests/Honua.Sdk.OgcFeatures.Tests/Honua.Sdk.OgcFeatures.Tests.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet test "${project}" --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          done

      - name: Build canonical sample
        run: dotnet build examples/AdminBootstrapConsole/AdminBootstrapConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build field data reference sample
        run: dotnet build examples/FieldDataCollection/FieldDataCollection.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Test canonical sample workflow
        run: dotnet test tests/AdminBootstrapConsole.Tests/AdminBootstrapConsole.Tests.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Validate package API compatibility
        shell: bash
        run: |
          baseline_ref="HEAD~1"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            baseline_ref="$(git describe --tags --abbrev=0 --match 'dotnet-sdk-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [[ -z "${baseline_ref}" ]]; then
              echo "No previous dotnet-sdk-v* tag found; using HEAD~1 as the API compatibility baseline."
              baseline_ref="HEAD~1"
            fi
          fi

          scripts/validate-api-compat.sh "${baseline_ref}"

      - name: Security audit (NuGet dependencies)
        shell: bash
        run: |
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.Wfs/Honua.Sdk.Wfs.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
          )

          errors=0

          for project in "${projects[@]}"; do
            output_file="/tmp/$(basename "${project}").audit.txt"
            dotnet list "${project}" package --vulnerable --include-transitive 2>&1 | tee "${output_file}"

            if grep -qi "has the following vulnerable packages" "${output_file}"; then
              echo "::error::Vulnerable NuGet dependencies detected in ${project}. Fix before publishing."
              errors=1
            fi
          done

          if [[ ${errors} -ne 0 ]]; then
            exit 1
          fi

      - name: Pack NuGet packages
        shell: bash
        run: |
          mkdir -p ./nupkgs
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.Wfs/Honua.Sdk.Wfs.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet pack "${project}" --configuration Release --no-build -o ./nupkgs
          done

      - name: Package install smoke
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT

          dotnet new console --framework net10.0 --output "${smoke_dir}"

          pushd "${smoke_dir}" >/dev/null

          cat > NuGet.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-sdk" value="${GITHUB_WORKSPACE}/nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="github-honua" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github-honua>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </github-honua>
            </packageSourceCredentials>
            <packageSourceMapping>
              <packageSource key="local-sdk">
                <package pattern="Honua.Sdk.*" />
              </packageSource>
              <packageSource key="github-honua">
                <package pattern="Geospatial.Grpc" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          dotnet add package Microsoft.Extensions.Hosting --version 10.0.0
          dotnet add package Honua.Sdk.Abstractions --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Admin --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Grpc --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Wfs --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.GeoServices --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.OgcFeatures --version "${PACKAGE_VERSION}"

          cat <<'EOF' > Program.cs
          using Honua.Sdk.Abstractions.Features;
          using Honua.Sdk.Admin;
          using Honua.Sdk.Admin.Extensions;
          using Honua.Sdk.Admin.Geocoding;
          using Honua.Sdk.GeoServices.Extensions;
          using Honua.Sdk.GeoServices.FeatureServer;
          using Honua.Sdk.GeoServices.FeatureServer.Models;
          using Honua.Sdk.Grpc;
          using Honua.Sdk.Grpc.Extensions;
          using Honua.Sdk.Grpc.Models;
          using Honua.Sdk.OgcFeatures;
          using Honua.Sdk.OgcFeatures.Extensions;
          using Honua.Sdk.OgcFeatures.Models;
          using Honua.Sdk.Wfs;
          using Honua.Sdk.Wfs.Extensions;
          using Honua.Sdk.Wfs.Models;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.Hosting;

          var builder = Host.CreateApplicationBuilder(args);
          var baseUri = new Uri("https://example.honua.test");

          builder.Services.AddHonuaAdmin(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaGeocoding(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaGrpc(options => options.Address = baseUri.ToString());
          builder.Services.AddHonuaWfs(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaFeatureServer(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaOgcFeatures(options => options.BaseAddress = baseUri);

          using var host = builder.Build();

          _ = host.Services.GetRequiredService<IHonuaAdminClient>();
          _ = host.Services.GetRequiredService<IHonuaGeocodingClient>();
          _ = host.Services.GetRequiredService<IHonuaGrpcClient>();
          _ = host.Services.GetRequiredService<IHonuaWfsClient>();
          _ = host.Services.GetRequiredService<IHonuaFeatureServerClient>();
          _ = host.Services.GetRequiredService<IHonuaOgcFeaturesClient>();
          _ = host.Services.GetServices<IHonuaFeatureQueryClient>().ToArray();

          _ = new QueryFeaturesRequest
          {
              ServiceId = "sdk_demo",
              LayerId = 0,
              ResultRecordCount = 1,
              ReturnGeometry = false
          };

          _ = new GetFeaturesRequest
          {
              TypeNames = "sdk_demo_points",
              Count = 1
          };

          _ = new FeatureServerQueryParams
          {
              Where = "1=1",
              ResultRecordCount = 1,
              ReturnGeometry = false
          };

          _ = new OgcItemsParams
          {
              Limit = 1
          };
          EOF

          dotnet build --configuration Release

          popd >/dev/null

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages
          path: ./nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 90

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "Dry run complete. Built packages:" >> "${GITHUB_STEP_SUMMARY}"
          ls -1 ./nupkgs/*.nupkg >> "${GITHUB_STEP_SUMMARY}"

  release-staging-integration:
    name: Release Staging Integration
    needs: release-smoke
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
    uses: ./.github/workflows/staging-integration.yml
    with:
      artifact-retention: 90
    secrets: inherit

  publish-dotnet-packages:
    name: Publish Packages
    needs:
      - release-smoke
      - release-staging-integration
    if: >-
      ${{
        needs.release-smoke.result == 'success' &&
        (needs.release-staging-integration.result == 'success' || needs.release-staging-integration.result == 'skipped') &&
        !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
