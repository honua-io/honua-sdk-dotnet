name: Publish .NET SDK Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build and validation only (skip publish)"
        required: false
        default: true
        type: boolean
      run_staging:
        description: "Run staging integration before publishing"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "dotnet-sdk-v*"

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ github.repository }}-${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Validate package versions
        shell: bash
        run: |
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Processes/Honua.Sdk.Processes.csproj"
            "src/Honua.Sdk.Geometry/Honua.Sdk.Geometry.csproj"
            "src/Honua.Sdk.Spec/Honua.Sdk.Spec.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.Scenes/Honua.Sdk.Scenes.csproj"
            "src/Honua.Sdk.Field/Honua.Sdk.Field.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
            "src/Honua.Sdk.Catalogs/Honua.Sdk.Catalogs.csproj"
            "src/Honua.Sdk.Offline/Honua.Sdk.Offline.csproj"
            "src/Honua.Sdk.Studio/Honua.Sdk.Studio.csproj"
            "src/Honua.Sdk/Honua.Sdk.csproj"
          )

          errors=0
          package_version=""

          get_package_version() {
            dotnet msbuild "$1" -nologo -getProperty:PackageVersion
          }

          for project in "${projects[@]}"; do
            version="$(get_package_version "${project}")"
            if [[ -z "${version}" ]]; then
              echo "Could not resolve PackageVersion for ${project}."
              errors=1
              continue
            fi

            if [[ -z "${package_version}" ]]; then
              package_version="${version}"
            elif [[ "${package_version}" != "${version}" ]]; then
              echo "Package version mismatch: ${project} has ${version}; expected ${package_version}."
              errors=1
            fi
          done

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#dotnet-sdk-v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag version (${tag_version}) does not match package version (${package_version})."
              errors=1
            fi
          fi

          if [[ ${errors} -ne 0 ]]; then
            exit 1
          fi

          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Build SDK packages
        shell: bash
        run: |
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Processes/Honua.Sdk.Processes.csproj"
            "src/Honua.Sdk.Geometry/Honua.Sdk.Geometry.csproj"
            "src/Honua.Sdk.Spec/Honua.Sdk.Spec.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.Scenes/Honua.Sdk.Scenes.csproj"
            "src/Honua.Sdk.Field/Honua.Sdk.Field.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
            "src/Honua.Sdk.Catalogs/Honua.Sdk.Catalogs.csproj"
            "src/Honua.Sdk.Offline/Honua.Sdk.Offline.csproj"
            "src/Honua.Sdk.Studio/Honua.Sdk.Studio.csproj"
            "src/Honua.Sdk/Honua.Sdk.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet build "${project}" --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          done

      - name: Test SDK packages
        shell: bash
        run: |
          projects=(
            "tests/Honua.Sdk.Admin.Tests/Honua.Sdk.Admin.Tests.csproj"
            "tests/Honua.Sdk.Processes.Tests/Honua.Sdk.Processes.Tests.csproj"
            "tests/Honua.Sdk.Geometry.Tests/Honua.Sdk.Geometry.Tests.csproj"
            "tests/Honua.Sdk.Spec.Tests/Honua.Sdk.Spec.Tests.csproj"
            "tests/Honua.Sdk.Grpc.Tests/Honua.Sdk.Grpc.Tests.csproj"
            "tests/Honua.Sdk.GeoServices.Tests/Honua.Sdk.GeoServices.Tests.csproj"
            "tests/Honua.Sdk.Scenes.Tests/Honua.Sdk.Scenes.Tests.csproj"
            "tests/Honua.Sdk.Field.Tests/Honua.Sdk.Field.Tests.csproj"
            "tests/Honua.Sdk.OgcFeatures.Tests/Honua.Sdk.OgcFeatures.Tests.csproj"
            "tests/Honua.Sdk.OgcFeatures.WfsTests/Honua.Sdk.OgcFeatures.WfsTests.csproj"
            "tests/Honua.Sdk.Catalogs.RecordsTests/Honua.Sdk.Catalogs.RecordsTests.csproj"
            "tests/Honua.Sdk.Catalogs.StacTests/Honua.Sdk.Catalogs.StacTests.csproj"
            "tests/Honua.Sdk.Offline.Tests/Honua.Sdk.Offline.Tests.csproj"
            "tests/Honua.Sdk.Studio.Tests/Honua.Sdk.Studio.Tests.csproj"
            "tests/Honua.Sdk.MetaSmoke.Tests/Honua.Sdk.MetaSmoke.Tests.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet test "${project}" --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          done

      - name: Build canonical sample
        run: dotnet build examples/AdminBootstrapConsole/AdminBootstrapConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build spec plan apply sample
        run: dotnet build examples/SpecPlanApplyConsole/SpecPlanApplyConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build studio analysis report sample
        run: dotnet build examples/StudioAnalysisReportConsole/StudioAnalysisReportConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build realtime worker sample
        run: dotnet build examples/RealtimeWorker/RealtimeWorker.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build routing geofence sample
        run: dotnet build examples/RoutingGeofenceConsole/RoutingGeofenceConsole.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Build field data reference sample
        run: dotnet build examples/FieldDataCollection/FieldDataCollection.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Test canonical sample workflow
        run: dotnet test tests/AdminBootstrapConsole.Tests/AdminBootstrapConsole.Tests.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Test deterministic demo suite
        run: dotnet test tests/DemoSuite.Tests/DemoSuite.Tests.csproj --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Validate package API compatibility
        shell: bash
        run: |
          baseline_ref="HEAD~1"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            baseline_ref="$(git describe --tags --abbrev=0 --match 'dotnet-sdk-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [[ -z "${baseline_ref}" ]]; then
              echo "No previous dotnet-sdk-v* tag found; using HEAD~1 as the API compatibility baseline."
              baseline_ref="HEAD~1"
            fi
          fi

          scripts/validate-api-compat.sh "${baseline_ref}"

      - name: Security audit (NuGet dependencies)
        shell: bash
        run: |
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Processes/Honua.Sdk.Processes.csproj"
            "src/Honua.Sdk.Geometry/Honua.Sdk.Geometry.csproj"
            "src/Honua.Sdk.Spec/Honua.Sdk.Spec.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.Scenes/Honua.Sdk.Scenes.csproj"
            "src/Honua.Sdk.Field/Honua.Sdk.Field.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
            "src/Honua.Sdk.Catalogs/Honua.Sdk.Catalogs.csproj"
            "src/Honua.Sdk.Offline/Honua.Sdk.Offline.csproj"
            "src/Honua.Sdk.Studio/Honua.Sdk.Studio.csproj"
            "src/Honua.Sdk/Honua.Sdk.csproj"
          )

          errors=0

          for project in "${projects[@]}"; do
            output_file="/tmp/$(basename "${project}").audit.txt"
            dotnet list "${project}" package --vulnerable --include-transitive 2>&1 | tee "${output_file}"

            if grep -qi "has the following vulnerable packages" "${output_file}"; then
              echo "::error::Vulnerable NuGet dependencies detected in ${project}. Fix before publishing."
              errors=1
            fi
          done

          if [[ ${errors} -ne 0 ]]; then
            exit 1
          fi

      - name: Pack NuGet packages
        shell: bash
        run: |
          mkdir -p ./nupkgs
          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Processes/Honua.Sdk.Processes.csproj"
            "src/Honua.Sdk.Geometry/Honua.Sdk.Geometry.csproj"
            "src/Honua.Sdk.Spec/Honua.Sdk.Spec.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.Scenes/Honua.Sdk.Scenes.csproj"
            "src/Honua.Sdk.Field/Honua.Sdk.Field.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
            "src/Honua.Sdk.Catalogs/Honua.Sdk.Catalogs.csproj"
            "src/Honua.Sdk.Offline/Honua.Sdk.Offline.csproj"
            "src/Honua.Sdk.Studio/Honua.Sdk.Studio.csproj"
            "src/Honua.Sdk/Honua.Sdk.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet pack "${project}" --configuration Release --no-build -o ./nupkgs
          done

      - name: Generate CycloneDX SBOM per package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./sboms
          dotnet tool update --global CycloneDX --version 4.* >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"

          projects=(
            "src/Honua.Sdk.Abstractions/Honua.Sdk.Abstractions.csproj"
            "src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj"
            "src/Honua.Sdk.Processes/Honua.Sdk.Processes.csproj"
            "src/Honua.Sdk.Geometry/Honua.Sdk.Geometry.csproj"
            "src/Honua.Sdk.Spec/Honua.Sdk.Spec.csproj"
            "src/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj"
            "src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj"
            "src/Honua.Sdk.Scenes/Honua.Sdk.Scenes.csproj"
            "src/Honua.Sdk.Field/Honua.Sdk.Field.csproj"
            "src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj"
            "src/Honua.Sdk.Catalogs/Honua.Sdk.Catalogs.csproj"
            "src/Honua.Sdk.Offline/Honua.Sdk.Offline.csproj"
            "src/Honua.Sdk.Studio/Honua.Sdk.Studio.csproj"
            "src/Honua.Sdk/Honua.Sdk.csproj"
          )

          for project in "${projects[@]}"; do
            pkg_id="$(basename "$(dirname "${project}")")"
            dotnet CycloneDX "${project}" \
              --json \
              --output "./sboms/${pkg_id}" \
              --filename "${pkg_id}.cdx.json"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-sboms
          path: ./sboms/**/*.cdx.json
          if-no-files-found: error

      - name: Sign NuGet packages
        if: env.NUGET_SIGNING_CERTIFICATE_BASE64 != '' && env.NUGET_SIGNING_PASSWORD != ''
        env:
          NUGET_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NUGET_SIGNING_CERTIFICATE_BASE64 }}
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
          NUGET_SIGNING_TIMESTAMP_URL: ${{ vars.NUGET_SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$(mktemp --suffix=.pfx)"
          trap 'shred -u "${cert_path}" 2>/dev/null || rm -f "${cert_path}"' EXIT
          echo "${NUGET_SIGNING_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"

          for nupkg in ./nupkgs/*.nupkg; do
            dotnet nuget sign "${nupkg}" \
              --certificate-path "${cert_path}" \
              --certificate-password "${NUGET_SIGNING_PASSWORD}" \
              --timestamper "${NUGET_SIGNING_TIMESTAMP_URL}"
            dotnet nuget verify "${nupkg}"
          done

      - name: Package signing required on release tags
        if: (env.NUGET_SIGNING_CERTIFICATE_BASE64 == '' || env.NUGET_SIGNING_PASSWORD == '') && startsWith(github.ref, 'refs/tags/dotnet-sdk-v')
        env:
          NUGET_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NUGET_SIGNING_CERTIFICATE_BASE64 }}
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
        run: |
          echo "::error::Release-tag publish requires NUGET_SIGNING_CERTIFICATE_BASE64 and NUGET_SIGNING_PASSWORD secrets to sign packages. Failing the build."
          exit 1

      - name: Package signing notice (dry-run / non-tag)
        if: (env.NUGET_SIGNING_CERTIFICATE_BASE64 == '' || env.NUGET_SIGNING_PASSWORD == '') && !startsWith(github.ref, 'refs/tags/dotnet-sdk-v')
        env:
          NUGET_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NUGET_SIGNING_CERTIFICATE_BASE64 }}
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
        run: |
          echo "::warning::NUGET_SIGNING_CERTIFICATE_BASE64 / NUGET_SIGNING_PASSWORD not configured — packages will be published UNSIGNED. This is allowed for dry-runs and non-tag builds; release tags require signing."

      - name: Package install smoke
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT

          dotnet new console --framework net10.0 --output "${smoke_dir}"

          pushd "${smoke_dir}" >/dev/null

          cat > NuGet.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-sdk" value="${GITHUB_WORKSPACE}/nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="github-honua" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github-honua>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </github-honua>
            </packageSourceCredentials>
            <packageSourceMapping>
              <packageSource key="local-sdk">
                <package pattern="Honua.Sdk" />
                <package pattern="Honua.Sdk.*" />
              </packageSource>
              <packageSource key="github-honua">
                <package pattern="Geospatial.Grpc" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          dotnet add package Microsoft.Extensions.Hosting --version 10.0.0
          dotnet add package Honua.Sdk.Abstractions --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Admin --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Processes --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Geometry --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Spec --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Grpc --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.GeoServices --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Scenes --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Field --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.OgcFeatures --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Catalogs --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Offline --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk.Studio --version "${PACKAGE_VERSION}"
          dotnet add package Honua.Sdk --version "${PACKAGE_VERSION}"

          cat <<'EOF' > Program.cs
          using Honua.Sdk;
          using Honua.Sdk.Abstractions.Features;
          using Honua.Sdk.Admin;
          using Honua.Sdk.Admin.Extensions;
          using Honua.Sdk.Admin.Geocoding;
          using Honua.Sdk.Processes;
          using Honua.Sdk.Processes.Extensions;
          using Honua.Sdk.Processes.Models;
          using Honua.Sdk.Geometry;
          using Honua.Sdk.Spec;
          using Honua.Sdk.Spec.Extensions;
          using Honua.Sdk.Spec.Models;
          using Honua.Sdk.GeoServices.Extensions;
          using Honua.Sdk.GeoServices.FeatureServer;
          using Honua.Sdk.GeoServices.FeatureServer.Models;
          using Honua.Sdk.Abstractions.Scenes;
          using Honua.Sdk.Scenes;
          using Honua.Sdk.Scenes.Extensions;
          using Honua.Sdk.Field.Forms;
          using Honua.Sdk.Field.Records;
          using Honua.Sdk.Grpc;
          using Honua.Sdk.Grpc.Extensions;
          using Honua.Sdk.Grpc.Models;
          using Honua.Sdk.Offline;
          using Honua.Sdk.Offline.Abstractions;
          using Honua.Sdk.OgcFeatures;
          using Honua.Sdk.OgcFeatures.Extensions;
          using Honua.Sdk.OgcFeatures.Models;
          using Honua.Sdk.Catalogs.Records;
          using Honua.Sdk.Catalogs.Records.Extensions;
          using Honua.Sdk.Catalogs.Records.Models;
          using Honua.Sdk.Catalogs.Stac;
          using Honua.Sdk.Catalogs.Stac.Extensions;
          using Honua.Sdk.Catalogs.Stac.Models;
          using Honua.Sdk.OgcFeatures.Wfs;
          using Honua.Sdk.OgcFeatures.Wfs.Extensions;
          using Honua.Sdk.OgcFeatures.Wfs.Models;
          using Honua.Sdk.Studio;
          using Honua.Sdk.Studio.Extensions;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.Hosting;

          var builder = Host.CreateApplicationBuilder(args);
          var baseUri = new Uri("https://example.honua.test");

          // Exercise the umbrella facade once to confirm the meta package is
          // resolvable + AddHonua wires up. Use a throwaway service collection
          // so it doesn't conflict with the per-package registrations below
          // (those exercise the narrow extensions on the same project).
          var metaSmokeServices = new ServiceCollection();
          metaSmokeServices.AddHonua(o =>
          {
              o.BaseAddress = baseUri;
              o.EnableRetry = false;
          });
          using (var metaProvider = metaSmokeServices.BuildServiceProvider())
          {
              _ = metaProvider.GetRequiredService<IHonuaGrpcClient>();
              _ = metaProvider.GetRequiredService<IHonuaAdminClient>();
              _ = metaProvider.GetRequiredService<IHonuaOgcFeaturesClient>();
              _ = metaProvider.GetRequiredService<IHonuaProcessesClient>();
          }

          builder.Services.AddHonuaAdmin(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaGeocoding(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaProcesses(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaSpec(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaGrpc(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaWfs(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaFeatureServer(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaScenes(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaOgcFeatures(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaOgcRecords(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaStac(options => options.BaseAddress = baseUri);
          builder.Services.AddHonuaStudio(options => options.BaseAddress = baseUri);

          using var host = builder.Build();

          _ = host.Services.GetRequiredService<IHonuaAdminClient>();
          _ = host.Services.GetRequiredService<IHonuaGeocodingClient>();
          _ = host.Services.GetRequiredService<IHonuaProcessesClient>();
          _ = host.Services.GetRequiredService<IHonuaSpecClient>();
          _ = host.Services.GetRequiredService<IHonuaGrpcClient>();
          _ = host.Services.GetRequiredService<IHonuaWfsClient>();
          _ = host.Services.GetRequiredService<IHonuaFeatureServerClient>();
          _ = host.Services.GetRequiredService<IHonuaSceneClient>();
          _ = host.Services.GetRequiredService<IHonuaOgcFeaturesClient>();
          _ = host.Services.GetRequiredService<IHonuaOgcRecordsClient>();
          _ = host.Services.GetRequiredService<IHonuaStacClient>();
          _ = host.Services.GetRequiredService<IHonuaStudioReportsClient>();
          _ = host.Services.GetServices<IHonuaFeatureQueryClient>().ToArray();
          _ = HonuaSpatialReference.Wgs84;

          _ = new Honua.Sdk.Grpc.Models.QueryFeaturesRequest
          {
              ServiceId = "sdk_demo",
              LayerId = 0,
              ResultRecordCount = 1,
              ReturnGeometry = false
          };

          _ = new HonuaProcessExecuteRequest
          {
              Inputs = new HonuaProcessExecuteInputs
              {
                  Plan = new HonuaAnalysisPlan
                  {
                      PlanId = "package-smoke",
                      WorkflowFamily = "analyze",
                      Steps = []
                  }
              }
          };

          _ = new SpecDocumentRequest
          {
              GrammarVersion = "spec/v1",
              ProcessFamilyVersion = "process/v1",
              Nodes =
              [
                  new SpecNodeRequest
                  {
                      Id = "source",
                      Kind = SpecResourceKind.Dataset,
                      Op = "catalog.source"
                  }
              ]
          };

          _ = new GetFeaturesRequest
          {
              TypeNames = "sdk_demo_points",
              Count = 1
          };

          _ = new FeatureServerQueryParams
          {
              Where = "1=1",
              ResultRecordCount = 1,
              ReturnGeometry = false
          };

          _ = new HonuaSceneListRequest
          {
              Capabilities = [HonuaSceneCapabilities.ThreeDimensionalTiles]
          };

          var form = new FormDefinition
          {
              FormId = "inspection",
              Name = "Inspection",
              Sections =
              [
                  new FormSection
                  {
                      SectionId = "main",
                      Label = "Main",
                      Fields =
                      [
                          new FormField { FieldId = "asset_id", Label = "Asset ID", Type = FormFieldType.Text, Required = true }
                      ]
                  }
              ]
          };

          _ = FormValidator.Validate(form, new FieldRecord
          {
              RecordId = "record-1",
              FormId = form.FormId,
              Values = { ["asset_id"] = "A-100" }
          });

          _ = new OgcItemsParams
          {
              Limit = 1
          };

          _ = new OgcRecordsQuery
          {
              Limit = 1,
              Query = "parks"
          };

          _ = new StacSearchQuery
          {
              Collections = ["imagery"],
              Limit = 1
          };

          _ = OfflineDownloadPlanner.CreatePlan(new OfflinePackageManifest
          {
              PackageId = "smoke",
              Sources =
              [
                  new OfflineSourceDescriptor
                  {
                      SourceId = "parks",
                      Source = new SourceDescriptor
                      {
                          Id = "parks",
                          Protocol = FeatureProtocolIds.OgcFeatures,
                          Locator = new SourceLocator { CollectionId = "parks" }
                      },
                      OutFields = ["name"],
                      PageSize = 10
                  }
              ]
          });
          EOF

          dotnet build --configuration Release

          popd >/dev/null

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages
          path: ./nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 90

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "Dry run complete. Built packages:" >> "${GITHUB_STEP_SUMMARY}"
          ls -1 ./nupkgs/*.nupkg >> "${GITHUB_STEP_SUMMARY}"

  release-staging-integration:
    name: Release Staging Integration
    needs: release-smoke
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_staging == 'true') }}
    uses: ./.github/workflows/staging-integration.yml
    with:
      artifact-retention: 90
    secrets: inherit

  publish-dotnet-packages:
    name: Publish Packages
    needs:
      - release-smoke
      - release-staging-integration
    if: >-
      ${{
        always() &&
        needs.release-smoke.result == 'success' &&
        (needs.release-staging-integration.result == 'success' || needs.release-staging-integration.result == 'skipped') &&
        !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-publish-dotnet-sdk-${{ github.run_id }}-packages
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
